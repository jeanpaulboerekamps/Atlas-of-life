<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Atlas of Life — iPad optimized</title>
<style>
:root{--sea:#dcecf2;--ink:#17372f;--panel:#fffdf9ee;--muted:#60776e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sea);font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}
#app{position:relative;width:100%;height:100%;background:linear-gradient(145deg,#f5f7f1,#dce9ec)}
svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.sea{fill:#d7e8ef}
.grid{fill:none;stroke:#507386;stroke-width:1;opacity:.07;vector-effect:non-scaling-stroke}
.taxonPath{cursor:pointer;stroke:#fffef9;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.label{font-weight:750;fill:#17372f;pointer-events:none;paint-order:stroke;stroke:#fffdf8dd;stroke-width:2.4px;stroke-linejoin:round}
.top{position:absolute;left:16px;right:16px;top:14px;display:flex;gap:10px;align-items:center;pointer-events:none}
.card{background:var(--panel);border:1px solid #35524722;border-radius:16px;box-shadow:0 9px 30px #35524718;backdrop-filter:blur(10px);pointer-events:auto}
.brand{padding:10px 13px;min-width:205px}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}
.search{flex:1;max-width:620px;padding:9px 12px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}
.controls{margin-left:auto;padding:7px;display:flex;gap:7px}.controls button{border:1px solid #35524725;background:#fffdf9;color:#24463c;border-radius:10px;padding:8px 10px}
#crumbs{position:absolute;left:16px;top:76px;display:flex;gap:5px;flex-wrap:wrap;max-width:72vw}.crumb{background:#fffdf9ec;border:1px solid #35524720;border-radius:999px;padding:5px 8px;font-size:10px;cursor:pointer}
.status{position:absolute;left:16px;bottom:16px;padding:9px 11px;font-size:10px;color:#536d64}
.zoom{position:absolute;right:16px;bottom:16px;padding:8px 10px;font-size:10px}
.level{position:absolute;right:16px;top:77px;padding:7px 10px;font-size:10px;color:#4d6b61}
.legend{position:absolute;right:16px;top:118px;padding:8px 10px;font-size:10px;display:grid;gap:4px}
.legend span{display:flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
</style></head>
<body><div id="app">
<svg id="map" viewBox="0 0 2400 1500">
<rect class="sea" width="2400" height="1500"/>
<g class="grid"><path d="M0 300 C600 245 1650 350 2400 280"/><path d="M0 730 C700 650 1700 810 2400 700"/><path d="M0 1130 C650 1060 1700 1200 2400 1090"/></g>
<g id="regions"></g><g id="labels"></g>
</svg>
<div class="top">
  <div class="card brand"><b>Atlas of Life</b><small>semantic cartographic prototype</small></div>
  <div class="card search"><input id="search" placeholder="Zoek taxon (Nederlands of wetenschappelijk)…" autocomplete="off"></div>
  <div class="card controls"><button id="home">Wereld</button></div>
</div>
<div id="crumbs"></div>
<div id="status" class="card status">taxonomie laden…</div>
<div id="level" class="card level">wereld</div>
<div class="card legend">
  <span><i class="dot" style="background:#4f93c6"></i>Animalia</span>
  <span><i class="dot" style="background:#4da85c"></i>Plantae</span>
  <span><i class="dot" style="background:#8e62b5"></i>Fungi</span>
  <span><i class="dot" style="background:#d08b32"></i>Bacteria</span>
</div>
<div id="zoom" class="card zoom">1.00×</div>
</div>
<script>
(async()=>{
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map'),rg=document.getElementById('regions'),lg=document.getElementById('labels');
const status=document.getElementById('status'),zoomEl=document.getElementById('zoom'),levelEl=document.getElementById('level'),crumbs=document.getElementById('crumbs');
const payload=await fetch('data/taxa.json',{cache:'no-store'}).then(r=>r.json());
const taxa=payload.taxa;
const byId=new Map(taxa.map(t=>[String(t.id),t]));
let roots=taxa.filter(t=>!t.parentId||!byId.has(String(t.parentId)));
if(roots.length>1){
  const life={id:'__life',parentId:null,canonicalName:'Life',rank:'ROOT',weight:roots.reduce((a,t)=>a+(+t.weight||1),0),depth:-1};
  taxa.push(life);byId.set(life.id,life);roots.forEach(t=>t.parentId=life.id);roots=[life];
}
const children=new Map();
taxa.forEach(t=>{const p=String(t.parentId);if(!children.has(p))children.set(p,[]);children.get(p).push(t)});

function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967295}
function h2(s,k=0){return hash(String(s)+'|'+k)}
const palette={Animalia:'#4f93c6',Plantae:'#4da85c',Fungi:'#8e62b5',Bacteria:'#d08b32',Other:'#7ba79d'};
function tint(hex,f){let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return`rgb(${Math.round(r+(255-r)*f)},${Math.round(g+(255-g)*f)},${Math.round(b+(255-b)*f)})`}
function kingdomOf(t){let x=t,guard=0;while(x&&guard++<20){const n=(x.canonicalName||'').toLowerCase();if(n==='animalia')return'Animalia';if(n==='plantae')return'Plantae';if(n==='fungi')return'Fungi';if(n==='bacteria')return'Bacteria';x=byId.get(String(x.parentId))}return'Other'}

const subtreeMemo=new Map();
function subtree(t){
  const id=String(t.id); if(subtreeMemo.has(id))return subtreeMemo.get(id);
  const cs=children.get(id)||[], own=Math.max(.35,+t.weight||1);
  const v=cs.length?cs.reduce((a,c)=>a+subtree(c),0)+own*.06:own;
  subtreeMemo.set(id,v); return v;
}
subtree(roots[0]);

const world={x:0,y:0,w:2400,h:1500};
roots[0].geom={cx:1200,cy:760,rx:1110,ry:650};

/* O(n) deterministic flower layout: no collision simulation.
   Children are arranged on concentric rings inside each parent. */
function layout(parent){
  const cs=(children.get(String(parent.id))||[]).sort((a,b)=>subtree(b)-subtree(a));
  if(!cs.length)return;
  const pg=parent.geom,total=cs.reduce((a,c)=>a+subtree(c),0),base=Math.min(pg.rx,pg.ry);
  let ring=0,slot=0,capacity=1;
  for(let i=0;i<cs.length;i++){
    const c=cs[i],share=subtree(c)/total;
    if(slot>=capacity){ring++;slot=0;capacity=Math.min(18,6+ring*4)}
    const frac=capacity===1?0:slot/capacity;
    const angle=frac*Math.PI*2+h2(parent.id,ring)*.55;
    const ringR=capacity===1?0:base*(.24+.16*ring);
    const maxR=Math.max(base*.035,base*Math.sqrt(share)*.68);
    const r=Math.min(maxR,base*(ring===0?.34:.16));
    const asp=.82+.36*h2(c.id,1);
    let x=pg.cx+Math.cos(angle)*ringR,y=pg.cy+Math.sin(angle)*ringR;
    const limX=Math.max(1,pg.rx-r*asp*1.15),limY=Math.max(1,pg.ry-r/asp*1.15);
    const q=Math.sqrt(((x-pg.cx)/limX)**2+((y-pg.cy)/limY)**2);
    if(q>1){x=pg.cx+(x-pg.cx)/q;y=pg.cy+(y-pg.cy)/q}
    c.geom={cx:x,cy:y,rx:r*asp,ry:r/asp};
    slot++;
    layout(c);
  }
}
layout(roots[0]);

function organicPath(t){
  const q=t.geom;if(!q)return'';
  const n=12,pts=[];
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n,noise=.91+.09*h2(t.id,i+10);pts.push([q.cx+Math.cos(a)*q.rx*noise,q.cy+Math.sin(a)*q.ry*noise])}
  const mids=pts.map((p,i)=>[(p[0]+pts[(i+1)%n][0])/2,(p[1]+pts[(i+1)%n][1])/2]);
  let d=`M${mids[n-1][0]},${mids[n-1][1]}`;for(let i=0;i<n;i++)d+=` Q${pts[i][0]},${pts[i][1]} ${mids[i][0]},${mids[i][1]}`;return d+'Z';
}
function minZoom(t){
  const rank=(t.rank||'').toUpperCase(),d=Math.max(0,t.depth||0);
  const z={DOMAIN:1,KINGDOM:1,PHYLUM:1.15,CLASS:1.55,ORDER:2.2,FAMILY:3.3,GENUS:5.2,SPECIES:8.0}[rank]||1.4;
  return Math.max(z,1+d*.5);
}

/* Dynamic DOM: only visible semantic levels exist in the SVG. */
const mounted=new Map();
let lastBand=-1;
function renderAtZoom(z){
  const band=Math.floor(z*4);
  if(band===lastBand)return; lastBand=band;
  let deepest=0;
  for(const t of taxa){
    if(t.id==='__life'||!t.geom)continue;
    const should=z>=minZoom(t) && (t.geom.rx*z>1.7 || (t.depth||0)<3);
    const id=String(t.id),cur=mounted.get(id);
    if(should&&!cur){
      const p=document.createElementNS(NS,'path');
      p.setAttribute('d',organicPath(t));
      p.setAttribute('fill',tint(palette[kingdomOf(t)]||palette.Other,Math.min(.5,.08+(t.depth||0)*.05+.06*h2(t.id,40))));
      p.setAttribute('class','taxonPath');
      p.setAttribute('stroke-width',Math.max(.9,7-(t.depth||0)*.9));
      p.onclick=e=>{e.stopPropagation();focus(t)};
      rg.appendChild(p);
      let text=null;
      const rank=(t.rank||'').toUpperCase(),screenW=t.geom.rx*2*z;
      if(screenW>80 && ['DOMAIN','KINGDOM','PHYLUM','CLASS','ORDER','FAMILY'].includes(rank)){
        text=document.createElementNS(NS,'text');
        text.setAttribute('x',t.geom.cx);text.setAttribute('y',t.geom.cy);
        text.setAttribute('text-anchor','middle');text.setAttribute('class','label');
        text.textContent=t.vernacularName||t.canonicalName;
        text.setAttribute('font-size',Math.max(5,Math.min(16,10/z)));
        lg.appendChild(text);
      }
      mounted.set(id,{p,text,t});
    } else if(!should&&cur){
      cur.p.remove(); if(cur.text)cur.text.remove(); mounted.delete(id);
    } else if(should&&cur){
      deepest=Math.max(deepest,t.depth||0);
      if(cur.text){
        const screenW=t.geom.rx*2*z;
        if(screenW<70){cur.text.remove();cur.text=null}
        else cur.text.setAttribute('font-size',Math.max(5,Math.min(16,10/z)));
      }
    }
    if(should)deepest=Math.max(deepest,t.depth||0);
  }
  const names=['rijk/domein','stam','klasse','orde','familie','genus','soort'];
  levelEl.textContent=names[Math.min(names.length-1,Math.max(0,deepest))]||'wereld';
}

let view={...world},target={...world},ptr=new Map(),drag=false,last=null,pinch=null;
function fit(r){let ar=innerWidth/innerHeight,rr=r.w/r.h;if(rr>ar){let nh=r.w/ar,d=nh-r.h;r.y-=d/2;r.h=nh}else{let nw=r.h*ar,d=nw-r.w;r.x-=d/2;r.w=nw}}
function bbox(t){const q=t.geom;return{x:q.cx-q.rx,y:q.cy-q.ry,w:q.rx*2,h:q.ry*2}}
function focus(t){let r=bbox(t),pad=.34;r={x:r.x-r.w*pad,y:r.y-r.h*pad,w:r.w*(1+2*pad),h:r.h*(1+2*pad)};fit(r);target=r;renderCrumbs(t)}
function home(){target={...world};fit(target);crumbs.innerHTML=''}
document.getElementById('home').onclick=home;
function renderCrumbs(t){let arr=[];while(t&&t.id!=='__life'){arr.unshift(t);t=byId.get(String(t.parentId))}crumbs.innerHTML='';for(const x of arr){let s=document.createElement('span');s.className='crumb';s.textContent=x.canonicalName;s.onclick=()=>focus(x);crumbs.appendChild(s)}}

function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
const aliases=new Map([['keizerspinguin','Aptenodytes forsteri'],['keizerspinguïn','Aptenodytes forsteri'],['emperor penguin','Aptenodytes forsteri']].map(([a,b])=>[norm(a),b]));
const searchInput=document.getElementById('search');
async function searchTaxon(raw){
  const q=norm(raw),wanted=aliases.get(q)||raw.trim();
  let hit=taxa.find(t=>norm(t.vernacularName)===q||norm(t.canonicalName)===q)||taxa.find(t=>norm(t.canonicalName).includes(q));
  if(hit){focus(hit);status.textContent='Gevonden: '+(hit.vernacularName||hit.canonicalName);return}
  status.textContent='Zoeken in volledige taxonomie…';
  try{
    const m=await fetch('https://api.gbif.org/v1/species/match?verbose=true&name='+encodeURIComponent(wanted)).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});
    for(const name of [m.species,m.genus,m.family,m.order,m.class,m.phylum,m.kingdom].filter(Boolean)){
      hit=taxa.find(t=>norm(t.canonicalName)===norm(name));
      if(hit){focus(hit);status.textContent=(m.scientificName||wanted)+' → kaart toont '+hit.canonicalName;return}
    }
    status.textContent='Taxon gevonden, maar deze tak zit niet in de 2500-taxa kaart.';
  }catch(err){status.textContent='Niet gevonden. Probeer de wetenschappelijke naam.'}
}
searchInput.onkeydown=e=>{if(e.key==='Enter')searchTaxon(e.target.value)};

svg.addEventListener('wheel',e=>{e.preventDefault();let r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height,wx=target.x+px*target.w,wy=target.y+py*target.h,f=Math.exp(e.deltaY*.0012);target.w=Math.max(24,Math.min(3000,target.w*f));target.h=Math.max(15,Math.min(1900,target.h*f));target.x=wx-px*target.w;target.y=wy-py*target.h},{passive:false});
svg.onpointerdown=e=>{svg.setPointerCapture?.(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1){drag=true;last={x:e.clientX,y:e.clientY}}if(ptr.size===2){let p=[...ptr.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),v:{...target},cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2};drag=false}};
svg.onpointermove=e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2&&pinch){let p=[...ptr.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),sc=pinch.d/d,r=svg.getBoundingClientRect(),px=(pinch.cx-r.left)/r.width,py=(pinch.cy-r.top)/r.height,wx=pinch.v.x+px*pinch.v.w,wy=pinch.v.y+py*pinch.v.h;target.w=Math.max(24,Math.min(3000,pinch.v.w*sc));target.h=Math.max(15,Math.min(1900,pinch.v.h*sc));target.x=wx-px*target.w;target.y=wy-py*target.h}else if(drag){let dx=e.clientX-last.x,dy=e.clientY-last.y;target.x-=dx/innerWidth*target.w;target.y-=dy/innerHeight*target.h;last={x:e.clientX,y:e.clientY}}};
function end(e){ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(!ptr.size){drag=false;last=null}}svg.onpointerup=end;svg.onpointercancel=end;

function anim(){
  const k=.18;
  view.x+=(target.x-view.x)*k;view.y+=(target.y-view.y)*k;view.w+=(target.w-view.w)*k;view.h+=(target.h-view.h)*k;
  svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);
  const z=2400/view.w;zoomEl.textContent=z.toFixed(2)+'×';renderAtZoom(z);
  requestAnimationFrame(anim);
}
status.textContent=`${payload.meta.taxa||taxa.length} taxa · ${payload.meta.roots?payload.meta.roots.map(r=>r.name).join(' · '):payload.meta.source}`;
home();renderAtZoom(1);requestAnimationFrame(anim);
})();
</script></body></html>
