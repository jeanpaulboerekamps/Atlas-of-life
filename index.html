<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Atlas of Life — wild coast map v13</title>
<style>
:root{--sea:#dfece8;--ink:#17372f;--panel:#fffdf9ee;--muted:#60776e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sea);font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}
#app{position:relative;width:100%;height:100%;background:linear-gradient(145deg,#f4f6ef,#d9e8e5)}
svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.sea{fill:#deebe7}
.grid{fill:none;stroke:#5e7e73;stroke-width:1;opacity:.07;vector-effect:non-scaling-stroke}
.taxonPath{cursor:pointer;stroke:#fffdf8;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:opacity .18s,filter .12s}
.taxonPath:hover{filter:brightness(1.035)}
.label{font-weight:750;fill:#18372f;pointer-events:none;paint-order:stroke;stroke:#fffdf8dd;stroke-width:2.5px;stroke-linejoin:round}
.hidden{opacity:0;pointer-events:none}
.top{position:absolute;left:16px;right:16px;top:14px;display:flex;gap:10px;align-items:center;pointer-events:none}
.card{background:var(--panel);border:1px solid #35524723;border-radius:16px;box-shadow:0 9px 30px #3552471d;backdrop-filter:blur(11px);pointer-events:auto}
.brand{padding:10px 13px;min-width:225px}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}
.search{flex:1;max-width:560px;padding:9px 12px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}
.controls{margin-left:auto;padding:7px;display:flex;gap:7px}.controls button{border:1px solid #35524725;background:#fffdf9;color:#24463c;border-radius:10px;padding:8px 10px}
#crumbs{position:absolute;left:16px;top:76px;display:flex;gap:5px;flex-wrap:wrap;max-width:72vw}.crumb{background:#fffdf9e9;border:1px solid #35524720;border-radius:999px;padding:5px 8px;font-size:10px;cursor:pointer}
.status{position:absolute;left:16px;bottom:16px;padding:9px 11px;font-size:10px;color:#536d64}
.zoom{position:absolute;right:16px;bottom:16px;padding:8px 10px;font-size:10px}
.level{position:absolute;right:16px;top:77px;padding:7px 10px;font-size:10px;color:#4d6b61}
</style></head>
<body><div id="app">
<svg id="map" viewBox="0 0 2400 1500">
<rect class="sea" width="2400" height="1500"/>
<g class="grid">
  <path d="M0 300 C600 245 1650 350 2400 280"/>
  <path d="M0 730 C700 650 1700 810 2400 700"/>
  <path d="M0 1130 C650 1060 1700 1200 2400 1090"/>
</g>
<g id="regions"></g><g id="labels"></g>
</svg>
<div class="top">
  <div class="card brand"><b>Atlas of Life</b><small>wilde kusten · iNaturalist-gewogen taxonomische kaart</small></div>
  <div class="card search"><input id="search" placeholder="Zoek taxon…" autocomplete="off"></div>
  <div class="card controls"><button id="home">Wereld</button></div>
</div>
<div id="crumbs"></div>
<div id="status" class="card status">taxonomie laden…</div>
<div id="level" class="card level">wereld</div>
<div id="zoom" class="card zoom">1.00×</div>
</div>
<script>
(async()=>{
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map');
const rg=document.getElementById('regions'), lg=document.getElementById('labels');
const status=document.getElementById('status'), zoomEl=document.getElementById('zoom');
const levelEl=document.getElementById('level'), crumbs=document.getElementById('crumbs');

const payload=await fetch('data/taxa.json',{cache:'no-store'}).then(r=>r.json());
const taxa=payload.taxa;
const byId=new Map(taxa.map(t=>[String(t.id),t]));

let roots=taxa.filter(t=>!t.parentId||!byId.has(String(t.parentId)));
if(roots.length>1){
  const life={id:'__life',parentId:null,canonicalName:'Life',rank:'ROOT',
    mapWeight:roots.reduce((a,t)=>a+Math.max(.0001,+t.mapWeight||+t.weight||1),0),depth:-1};
  taxa.push(life);byId.set(life.id,life);roots.forEach(t=>t.parentId=life.id);roots=[life];
}

const children=new Map();
taxa.forEach(t=>{const p=String(t.parentId);if(!children.has(p))children.set(p,[]);children.get(p).push(t)});

function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967295}
function h2(s,k=0){return hash(String(s)+'|'+k)}
function weight(t){return Math.max(.0001,+t.mapWeight||+t.weight||1)}

const palette={DOMAIN:'#9eb9c4',KINGDOM:'#8fb9d4',PHYLUM:'#96c2ae',CLASS:'#a6cda0',ORDER:'#ccd995',FAMILY:'#bbd7ad',GENUS:'#cbdcbd',SPECIES:'#dfe9d8',ROOT:'#eef3eb'};
function tint(hex,f){let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return`rgb(${Math.round(r+(255-r)*f)},${Math.round(g+(255-g)*f)},${Math.round(b+(255-b)*f)})`}

function polygonArea(poly){let a=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];a+=p.x*q.y-q.x*p.y}return a/2}
function absArea(poly){return Math.abs(polygonArea(poly))}
function polygonCentroid(poly){let a=polygonArea(poly),cx=0,cy=0;if(Math.abs(a)<1e-8){let x=0,y=0;for(const p of poly){x+=p.x;y+=p.y}return{x:x/poly.length,y:y/poly.length}}for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],f=p.x*q.y-q.x*p.y;cx+=(p.x+q.x)*f;cy+=(p.y+q.y)*f}return{x:cx/(6*a),y:cy/(6*a)}}
function polyBBox(poly){let xs=poly.map(p=>p.x),ys=poly.map(p=>p.y);let x=Math.min(...xs),X=Math.max(...xs),y=Math.min(...ys),Y=Math.max(...ys);return{x,y,w:X-x,h:Y-y}}
function cleanPoly(poly){const out=[];for(const p of poly){const q=out[out.length-1];if(!q||Math.hypot(p.x-q.x,p.y-q.y)>.001)out.push({x:p.x,y:p.y})}if(out.length>2&&Math.hypot(out[0].x-out[out.length-1].x,out[0].y-out[out.length-1].y)<.001)out.pop();return out}

function clipHalf(poly,axis,cut,keepLow){
  const val=p=>axis==='x'?p.x:p.y,inside=p=>keepLow?val(p)<=cut+1e-7:val(p)>=cut-1e-7,out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length],ia=inside(a),ib=inside(b);
    if(ia)out.push({x:a.x,y:a.y});
    if(ia!==ib){const va=val(a),vb=val(b),t=(cut-va)/(vb-va);out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}
  }
  return cleanPoly(out)
}
function cutForFraction(poly,axis,fraction){
  const b=polyBBox(poly);let lo=axis==='x'?b.x:b.y,hi=axis==='x'?b.x+b.w:b.y+b.h;
  const total=absArea(poly),target=total*fraction;
  for(let i=0;i<42;i++){const mid=(lo+hi)/2,low=clipHalf(poly,axis,mid,true),a=low.length>=3?absArea(low):0;if(a<target)lo=mid;else hi=mid}
  return(lo+hi)/2
}
function cutVertices(poly,axis,cut){return poly.filter(p=>Math.abs((axis==='x'?p.x:p.y)-cut)<.04)}
function farthestPair(points){if(points.length<2)return null;let best=null,dmax=-1;for(let i=0;i<points.length;i++)for(let j=i+1;j<points.length;j++){let d=(points[i].x-points[j].x)**2+(points[i].y-points[j].y)**2;if(d>dmax){dmax=d;best=[points[i],points[j]]}}return best}
function wavyDivider(a,b,axis,seed,parentBox,depth){
  const pts=[],N=10,len=Math.hypot(b.x-a.x,b.y-a.y);
  const baseAmp=Math.min(len*(depth<2?.105:.078),Math.min(parentBox.w,parentBox.h)*(depth<2?.072:.052));
  const amp=baseAmp*(.7+.5*h2(seed,771)),phase=2*Math.PI*h2(seed,772),second=.28+.25*h2(seed,773);
  for(let i=0;i<=N;i++){
    const t=i/N,envelope=Math.sin(Math.PI*t);
    const off=amp*envelope*(Math.sin(2*Math.PI*t+phase)*.72+Math.sin(4*Math.PI*t-phase*.7)*second);
    let x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;if(axis==='x')x+=off;else y+=off;pts.push({x,y})
  }
  return pts
}
function replaceDivider(poly,axis,cut,wave){
  if(poly.length<3)return poly;const on=p=>Math.abs((axis==='x'?p.x:p.y)-cut)<.08;let edge=-1;
  for(let i=0;i<poly.length;i++){if(on(poly[i])&&on(poly[(i+1)%poly.length])){edge=i;break}}
  if(edge<0)return poly;
  const a=poly[edge],b=poly[(edge+1)%poly.length];
  const direct=Math.hypot(a.x-wave[0].x,a.y-wave[0].y)+Math.hypot(b.x-wave[wave.length-1].x,b.y-wave[wave.length-1].y);
  const reverse=Math.hypot(a.x-wave[wave.length-1].x,a.y-wave[wave.length-1].y)+Math.hypot(b.x-wave[0].x,b.y-wave[0].y);
  const seq=(direct<=reverse?wave:[...wave].reverse()).map(p=>({x:p.x,y:p.y})),out=[];
  for(let i=0;i<poly.length;i++){out.push({x:poly[i].x,y:poly[i].y});if(i===edge){for(let k=1;k<seq.length-1;k++)out.push(seq[k])}}
  return cleanPoly(out)
}
function splitItems(items){
  if(items.length<=1)return[items,[]];
  const sorted=[...items].sort((a,b)=>weight(b)-weight(a)),A=[],B=[];let wa=0,wb=0;
  for(const x of sorted){if(wa<=wb){A.push(x);wa+=weight(x)}else{B.push(x);wb+=weight(x)}}
  if(!A.length||!B.length){const m=Math.ceil(sorted.length/2);return[sorted.slice(0,m),sorted.slice(m)]}
  return[A,B]
}

function organicInset(poly,t,depth){
  if(!poly||poly.length<3)return poly;

  const c=polygonCentroid(poly);
  const b=polyBBox(poly);
  const rank=(t?.rank||'').toUpperCase();

  /* Higher levels get broader seas and more dramatic coastlines.
     Lower levels keep smaller margins so tiny taxa remain usable. */
  const gapByRank={
    DOMAIN:.090,KINGDOM:.090,PHYLUM:.078,CLASS:.066,
    ORDER:.056,FAMILY:.046,GENUS:.038,SPECIES:.031
  };
  const baseGap=gapByRank[rank] ?? Math.max(.030,.082-depth*.007);

  /* First make the original vertices irregular: some become capes
     (small inset), others retreat strongly and become bays. All movement
     is toward the centroid, so the new coast remains inside its ownership cell. */
  const anchors=poly.map((p,i)=>{
    const cape=h2(t?.id||'root',2000+i);
    const bay=h2(t?.id||'root',2300+i);
    let factor;

    if(cape>.79){
      factor=baseGap*(.22+.28*h2(t?.id||'root',2500+i));   // cape
    }else if(bay>.66){
      factor=baseGap*(1.45+.95*h2(t?.id||'root',2700+i));  // deep bay
    }else{
      factor=baseGap*(.65+.85*h2(t?.id||'root',2900+i));
    }

    /* Keep very small polygons from collapsing. */
    factor=Math.min(.30,Math.max(.008,factor));
    return {
      x:p.x+(c.x-p.x)*factor,
      y:p.y+(c.y-p.y)*factor
    };
  });

  const out=[];

  /* Insert several points per edge. Each inserted point independently becomes
     either a shallow headland or a deep indentation. This gives a much more
     Earth-like coastline while never pushing outside the partition cell. */
  for(let i=0;i<anchors.length;i++){
    const a=anchors[i],z=anchors[(i+1)%anchors.length];
    out.push(a);

    const edgeLen=Math.hypot(z.x-a.x,z.y-a.y);
    const localScale=Math.max(24,Math.min(b.w,b.h));

    /* Long edges get more coastline detail. */
    const extra=Math.max(
      1,
      Math.min(7,Math.floor(edgeLen/Math.max(42,localScale*.14)))
    );

    for(let k=1;k<=extra;k++){
      const u=k/(extra+1);

      let x=a.x+(z.x-a.x)*u;
      let y=a.y+(z.y-a.y)*u;

      const r1=h2(t?.id||'root',3200+i*31+k);
      const r2=h2(t?.id||'root',3600+i*37+k);
      const r3=h2(t?.id||'root',4000+i*41+k);

      /* Multiple scales: ordinary roughness, occasional fjord, occasional cape. */
      let pull;
      if(r1>.86){
        pull=(.070+.095*r2)*localScale;       // pronounced bay / fjord
      }else if(r1<.16){
        pull=(.004+.010*r2)*localScale;       // headland
      }else{
        pull=(.018+.050*r2)*localScale;       // normal rugged coast
      }

      /* Add a little tangential wandering as well, but keep it modest. */
      const ex=z.x-a.x,ey=z.y-a.y,elen=Math.hypot(ex,ey)||1;
      const tx=ex/elen,ty=ey/elen;
      const wander=(r3-.5)*Math.min(edgeLen*.10,localScale*.055);

      x+=tx*wander;
      y+=ty*wander;

      /* Crucially, the major displacement is only inward. */
      const dx=c.x-x,dy=c.y-y,d=Math.hypot(dx,dy)||1;
      x+=dx/d*pull;
      y+=dy/d*pull;

      out.push({x,y});
    }
  }

  /* A second deterministic erosion pass exaggerates a subset of bays.
     Again: inward only, so no sibling overlap can be introduced here. */
  const eroded=out.map((p,i)=>{
    const r=h2(t?.id||'root',5000+i);
    if(r<.74)return p;

    const amount=(.010+.035*h2(t?.id||'root',5400+i))*Math.min(b.w,b.h);
    const dx=c.x-p.x,dy=c.y-p.y,d=Math.hypot(dx,dy)||1;

    return {
      x:p.x+dx/d*amount,
      y:p.y+dy/d*amount
    };
  });

  return cleanPoly(eroded);
}

function partition(poly,items,depth,parentId){
  if(!items.length)return;
  if(items.length===1){
    const t=items[0];t.cellPoly=poly;t.depth=depth;t.poly=organicInset(poly,t,depth);
    const cs=children.get(String(t.id))||[];if(cs.length)partition(t.poly,cs,depth+1,String(t.id));return
  }
  const [A,B]=splitItems(items),wA=A.reduce((s,x)=>s+weight(x),0),wB=B.reduce((s,x)=>s+weight(x),0),fraction=wA/(wA+wB),box=polyBBox(poly);
  let axis;if(box.w>box.h*1.2)axis='x';else if(box.h>box.w*1.2)axis='y';else axis=h2(parentId,depth*43+A.length*7)>.5?'x':'y';
  let cut=cutForFraction(poly,axis,fraction),pA=clipHalf(poly,axis,cut,true),pB=clipHalf(poly,axis,cut,false);
  if(pA.length<3||pB.length<3){axis=axis==='x'?'y':'x';cut=cutForFraction(poly,axis,fraction);pA=clipHalf(poly,axis,cut,true);pB=clipHalf(poly,axis,cut,false)}
  if(pA.length>=3&&pB.length>=3){
    const pair=farthestPair(cutVertices(pA,axis,cut));
    if(pair){const wave=wavyDivider(pair[0],pair[1],axis,parentId+'|'+depth+'|'+A[0].id,box,depth);pA=replaceDivider(pA,axis,cut,wave);pB=replaceDivider(pB,axis,cut,wave)}
  }
  partition(pA,A,depth,parentId+'L');partition(pB,B,depth,parentId+'R')
}

function outerWorld(){return[{x:16,y:16},{x:2384,y:16},{x:2384,y:1484},{x:16,y:1484}]}
roots[0].poly=outerWorld();
partition(roots[0].poly,children.get(String(roots[0].id))||[],0,'Life');

function pathFromPoly(poly){
  if(!poly||poly.length<3)return'';
  const mids=poly.map((p,i)=>{const q=poly[(i+1)%poly.length];return{x:(p.x+q.x)/2,y:(p.y+q.y)/2}});
  let d=`M${mids[mids.length-1].x},${mids[mids.length-1].y}`;
  for(let i=0;i<poly.length;i++)d+=` Q${poly[i].x},${poly[i].y} ${mids[i].x},${mids[i].y}`;
  return d+'Z'
}
function minZoom(t){const d=Math.max(0,t.depth||0),rank=(t.rank||'').toUpperCase(),rankZ={DOMAIN:1,KINGDOM:1,PHYLUM:1.25,CLASS:1.65,ORDER:2.35,FAMILY:3.7,GENUS:5.5,SPECIES:8};return Math.max(rankZ[rank]||1.2,1+d*.56)}

const elems=[];
[...taxa].sort((a,b)=>(a.depth||0)-(b.depth||0)).forEach(t=>{
  if(t.id==='__life'||!t.poly||t.poly.length<3)return;
  t.box=polyBBox(t.poly);t.center=polygonCentroid(t.poly);t.area=absArea(t.poly);
  const p=document.createElementNS(NS,'path');p.setAttribute('d',pathFromPoly(t.poly));p.setAttribute('fill',tint(palette[t.rank]||'#b7d0c2',.02+.13*h2(t.id,50)));p.setAttribute('class','taxonPath');p.setAttribute('stroke-width',Math.max(1,8-(t.depth||0)));p.dataset.minz=minZoom(t);p.dataset.id=t.id;p.onclick=e=>{e.stopPropagation();focus(t)};rg.appendChild(p);
  const text=document.createElementNS(NS,'text');text.setAttribute('x',t.center.x);text.setAttribute('y',t.center.y);text.setAttribute('text-anchor','middle');text.setAttribute('class','label');text.textContent=t.vernacularName||t.canonicalName;text.dataset.minz=(minZoom(t)*1.02);text.dataset.id=t.id;lg.appendChild(text);
  elems.push({t,p,text})
});

const world={x:0,y:0,w:2400,h:1500};
let view={...world},target={...world},ptr=new Map(),drag=false,last=null,pinch=null,lastSemantic=-1;
function fit(r){let ar=innerWidth/innerHeight,rr=r.w/r.h;if(rr>ar){let nh=r.w/ar,d=nh-r.h;r.y-=d/2;r.h=nh}else{let nw=r.h*ar,d=nw-r.w;r.x-=d/2;r.w=nw}}
function bbox(t){return t.box||polyBBox(t.poly)}
function focus(t){let r={...bbox(t)},pad=.2;r={x:r.x-r.w*pad,y:r.y-r.h*pad,w:r.w*(1+2*pad),h:r.h*(1+2*pad)};fit(r);target=r;renderCrumbs(t);if((t.rank||'').toUpperCase()==='ORDER'&&t.inatObservationCount!=null){levelEl.textContent=`orde · ${Number(t.inatObservationCount).toLocaleString('nl-NL')} iNat-waarnemingen · gewicht ${Number(t.inatAreaWeight||1).toFixed(2)}`}else levelEl.textContent=(t.rank||'taxon').toLowerCase()}
function home(){target={...world};fit(target);crumbs.innerHTML='';levelEl.textContent='wereld'}
document.getElementById('home').onclick=home;
function renderCrumbs(t){let arr=[];while(t&&t.id!=='__life'){arr.unshift(t);t=byId.get(String(t.parentId))}crumbs.innerHTML='';for(const x of arr){let s=document.createElement('span');s.className='crumb';s.textContent=x.canonicalName;s.onclick=()=>focus(x);crumbs.appendChild(s)}}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
document.getElementById('search').onkeydown=e=>{if(e.key!=='Enter')return;let q=norm(e.target.value),hit=taxa.find(t=>norm(t.canonicalName)===q)||taxa.find(t=>norm(t.vernacularName)===q)||taxa.find(t=>norm(t.canonicalName).includes(q));if(hit)focus(hit)}

function semantic(z){
  if(Math.abs(z-lastSemantic)<.08)return;lastSemantic=z;let deepest=0;
  for(const o of elems){
    const visible=z>=+o.p.dataset.minz;o.p.classList.toggle('hidden',!visible);if(visible)deepest=Math.max(deepest,o.t.depth||0);
    const screenW=(o.t.box?.w||0)*z,screenH=(o.t.box?.h||0)*z,labelVisible=visible&&z>=+o.text.dataset.minz&&screenW>62&&screenH>26;
    o.text.classList.toggle('hidden',!labelVisible);if(labelVisible){const fs=Math.max(8,Math.min(22,8.5+Math.sqrt(Math.max(20,Math.min(screenW,screenH)*2))/4.4));o.text.setAttribute('font-size',fs/z)}
  }
  if(!crumbs.children.length){const names=['rijk/domein','stam','klasse','orde','familie','genus','soort'];levelEl.textContent=names[Math.min(names.length-1,Math.max(0,deepest))]||'wereld'}
}
svg.addEventListener('wheel',e=>{e.preventDefault();let r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height,wx=target.x+px*target.w,wy=target.y+py*target.h,f=Math.exp(e.deltaY*.0012);target.w=Math.max(24,Math.min(3000,target.w*f));target.h=Math.max(15,Math.min(1900,target.h*f));target.x=wx-px*target.w;target.y=wy-py*target.h},{passive:false});
