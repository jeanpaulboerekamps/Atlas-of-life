<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Atlas of Life — dataset prototype</title>
<style>
:root{--sea:#e5efeb;--ink:#18372f;--panel:#fffdf9ee}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:var(--sea);color:var(--ink)}
#app{position:relative;width:100%;height:100%}svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.taxon{cursor:pointer;stroke:#fffdf8;stroke-linejoin:round;vector-effect:non-scaling-stroke}.taxon:hover{filter:brightness(1.035)}
.label{font-weight:700;fill:#18372f;pointer-events:none;paint-order:stroke;stroke:#fff9;stroke-width:2px}.rank{font-size:9px;fill:#47675d;pointer-events:none}
.top{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:10px;pointer-events:none}
.card{background:var(--panel);border:1px solid #38574b24;border-radius:15px;box-shadow:0 8px 30px #38574b20;backdrop-filter:blur(10px);pointer-events:auto}
.brand{padding:10px 13px}.brand b{display:block}.brand small{color:#61776f}
.search{flex:1;max-width:520px;padding:8px 12px}.search input{border:0;outline:0;background:transparent;width:100%;font-size:14px;color:#18372f}
.controls{margin-left:auto;padding:7px}.controls button{border:1px solid #38574b22;background:#fffdf9;border-radius:10px;padding:8px 10px}
#crumbs{position:absolute;top:76px;left:14px;display:flex;gap:5px;flex-wrap:wrap;max-width:75vw}.crumb{background:#fffdf9e8;border:1px solid #38574b22;border-radius:999px;padding:5px 8px;font-size:10px;cursor:pointer}
.status{position:absolute;left:14px;bottom:14px;padding:9px 11px;font-size:10px;color:#536e65}.zoom{position:absolute;right:14px;bottom:14px;padding:8px 10px;font-size:10px}
</style></head><body><div id="app">
<svg id="map" viewBox="0 0 2400 1500"><rect width="2400" height="1500" fill="#e5efeb"/><g id="world"></g></svg>
<div class="top"><div class="card brand"><b>Atlas of Life</b><small>dataset-driven prototype</small></div>
<div class="card search"><input id="search" placeholder="Zoek wetenschappelijke naam…" autocomplete="off"></div>
<div class="card controls"><button id="home">Wereld</button></div></div>
<div id="crumbs"></div><div id="status" class="card status">taxonomie laden…</div><div id="zoom" class="card zoom">1.00×</div>
</div>
<script>
(async()=>{
const svg=document.getElementById('map'), g=document.getElementById('world'), status=document.getElementById('status'), zoomEl=document.getElementById('zoom'), crumbs=document.getElementById('crumbs');
const payload=await fetch('data/taxa.json',{cache:'no-store'}).then(r=>r.json());
const taxa=payload.taxa, byId=new Map(taxa.map(x=>[String(x.id),x]));
let roots=taxa.filter(x=>!x.parentId||!byId.has(String(x.parentId)));
if(roots.length>1){const life={id:'__life',parentId:null,canonicalName:'Life',rank:'ROOT',weight:roots.reduce((a,x)=>a+x.weight,0)}; taxa.push(life);byId.set(life.id,life);roots.forEach(x=>x.parentId=life.id);roots=[life]}
const children=new Map(); taxa.forEach(t=>{const p=String(t.parentId);if(!children.has(p))children.set(p,[]);children.get(p).push(t)});
const colors={KINGDOM:'#8fb9d4',DOMAIN:'#a6bcc6',PHYLUM:'#9fc6b1',CLASS:'#a8cfa1',ORDER:'#cbd899',FAMILY:'#bcd8b1',GENUS:'#c9dfc1',SPECIES:'#dce9d6',ROOT:'#eef3eb'};
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967295}
function tint(hex,j){let n=parseInt(hex.slice(1),16),r=n>>16,gc=(n>>8)&255,b=n&255,f=.06+j*.16;return`rgb(${Math.round(r+(255-r)*f)},${Math.round(gc+(255-gc)*f)},${Math.round(b+(255-b)*f)})`}
function sum(t){const c=children.get(String(t.id))||[];if(!c.length)return Math.max(.3,+t.weight||1);return c.reduce((a,x)=>a+sum(x),0)+Math.max(.3,+t.weight||1)*.08}
function layout(t,r,depth=0){t.rect=r;t.depth=depth;const cs=(children.get(String(t.id))||[]).sort((a,b)=>sum(b)-sum(a));if(!cs.length)return;let rem=cs.reduce((a,x)=>a+sum(x),0),x=r.x,y=r.y,w=r.w,h=r.h;for(let i=0;i<cs.length;i++){let c=cs[i],frac=sum(c)/rem,rr;if(i===cs.length-1)rr={x,y,w,h};else if(w>h){let cut=w*frac;rr={x,y,w:cut,h};x+=cut;w-=cut}else{let cut=h*frac;rr={x,y,w,h:cut};y+=cut;h-=cut}rem-=sum(c);let gap=Math.min(12,4+depth*1.4);layout(c,{x:rr.x+gap,y:rr.y+gap,w:Math.max(2,rr.w-gap*2),h:Math.max(2,rr.h-gap*2)},depth+1)}}
layout(roots[0],{x:35,y:35,w:2330,h:1430});
function pathFor(t){const r=t.rect,j=hash(t.id);let rad=Math.max(5,Math.min(40,Math.min(r.w,r.h)*(.10+.08*j)));return`M${r.x+rad},${r.y}H${r.x+r.w-rad}Q${r.x+r.w},${r.y} ${r.x+r.w},${r.y+rad}V${r.y+r.h-rad}Q${r.x+r.w},${r.y+r.h} ${r.x+r.w-rad},${r.y+r.h}H${r.x+rad}Q${r.x},${r.y+r.h} ${r.x},${r.y+r.h-rad}V${r.y+rad}Q${r.x},${r.y} ${r.x+rad},${r.y}Z`}
function draw(){g.innerHTML='';[...taxa].sort((a,b)=>a.depth-b.depth).forEach(t=>{if(t.id==='__life')return;let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',pathFor(t));p.setAttribute('fill',tint(colors[t.rank]||'#b9d1c5',hash(t.id)));p.setAttribute('class','taxon');p.setAttribute('stroke-width',Math.max(1,8-t.depth));p.onclick=e=>{e.stopPropagation();focus(t)};g.appendChild(p);let area=t.rect.w*t.rect.h;if(area>8500&&t.rect.w>70&&t.rect.h>35){let tx=document.createElementNS('http://www.w3.org/2000/svg','text');tx.setAttribute('x',t.rect.x+10);tx.setAttribute('y',t.rect.y+22);tx.setAttribute('font-size',Math.max(10,Math.min(24,9+Math.sqrt(area)/45)));tx.setAttribute('class','label');tx.textContent=t.vernacularName||t.canonicalName;g.appendChild(tx)}})}
draw();
let world={x:0,y:0,w:2400,h:1500},view={...world},target={...world},ptr=new Map(),drag=false,last=null,pinch=null;
function fit(r){let ar=innerWidth/innerHeight,rr=r.w/r.h;if(rr>ar){let nh=r.w/ar,d=nh-r.h;r.y-=d/2;r.h=nh}else{let nw=r.h*ar,d=nw-r.w;r.x-=d/2;r.w=nw}}
function focus(t){let r={...t.rect},pad=.12;r.x-=r.w*pad;r.y-=r.h*pad;r.w*=1+2*pad;r.h*=1+2*pad;fit(r);target=r;renderCrumbs(t)}
function home(){target={...world};fit(target);crumbs.innerHTML=''}
document.getElementById('home').onclick=home;
function renderCrumbs(t){let arr=[];while(t&&t.id!=='__life'){arr.unshift(t);t=byId.get(String(t.parentId))}crumbs.innerHTML='';for(const x of arr){let s=document.createElement('span');s.className='crumb';s.textContent=x.canonicalName;s.onclick=()=>focus(x);crumbs.appendChild(s)}}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
document.getElementById('search').onkeydown=e=>{if(e.key!=='Enter')return;let q=norm(e.target.value),hit=taxa.find(t=>norm(t.canonicalName)===q)||taxa.find(t=>norm(t.canonicalName).includes(q));if(hit)focus(hit)}
svg.addEventListener('wheel',e=>{e.preventDefault();let rect=svg.getBoundingClientRect(),px=(e.clientX-rect.left)/rect.width,py=(e.clientY-rect.top)/rect.height,wx=target.x+px*target.w,wy=target.y+py*target.h,f=Math.exp(e.deltaY*.0012);target.w=Math.max(35,Math.min(3000,target.w*f));target.h=Math.max(22,Math.min(1900,target.h*f));target.x=wx-px*target.w;target.y=wy-py*target.h},{passive:false});
svg.onpointerdown=e=>{svg.setPointerCapture?.(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1){drag=true;last={x:e.clientX,y:e.clientY}}if(ptr.size===2){let p=[...ptr.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),v:{...target},cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2};drag=false}};
svg.onpointermove=e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2&&pinch){let p=[...ptr.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),sc=pinch.d/d,rect=svg.getBoundingClientRect(),px=(pinch.cx-rect.left)/rect.width,py=(pinch.cy-rect.top)/rect.height,wx=pinch.v.x+px*pinch.v.w,wy=pinch.v.y+py*pinch.v.h;target.w=Math.max(35,Math.min(3000,pinch.v.w*sc));target.h=Math.max(22,Math.min(1900,pinch.v.h*sc));target.x=wx-px*target.w;target.y=wy-py*target.h}else if(drag){let dx=e.clientX-last.x,dy=e.clientY-last.y;target.x-=dx/innerWidth*target.w;target.y-=dy/innerHeight*target.h;last={x:e.clientX,y:e.clientY}}};
function end(e){ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(!ptr.size){drag=false;last=null}}svg.onpointerup=end;svg.onpointercancel=end;
function anim(){let k=.16;view.x+=(target.x-view.x)*k;view.y+=(target.y-view.y)*k;view.w+=(target.w-view.w)*k;view.h+=(target.h-view.h)*k;svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);zoomEl.textContent=(2400/view.w).toFixed(2)+'×';requestAnimationFrame(anim)}requestAnimationFrame(anim);
status.textContent=`${payload.meta.taxa||taxa.length} taxa · ${payload.meta.source}`;
})();
</script></body></html>
