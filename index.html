<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Atlas of Life — wild coast map v13</title>
<style>
:root{--sea:#2ea8d0;--ink:#17372f;--panel:#fffdf9f2;--muted:#60776e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sea);font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}
#app{position:relative;width:100%;height:100%;background:linear-gradient(145deg,#45b5d8,#208fc2)}
svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.sea{fill:url(#oceanGradient)}
.grid{fill:none;stroke:#d7f4fb;stroke-width:2;opacity:.10;vector-effect:non-scaling-stroke}
.taxonPath{cursor:pointer;stroke:#fffdf2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:opacity .18s,filter .12s;filter:drop-shadow(0 1px 1px #0c668522)}
.taxonPath:hover{filter:brightness(1.045)}
.continentHaloWide{fill:none;stroke:#b8ecf6;stroke-opacity:.22;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.continentHaloNear{fill:none;stroke:#fff8d8;stroke-opacity:.72;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.label{font-weight:750;fill:#18372f;pointer-events:none;paint-order:stroke;stroke:#fffdf8dd;stroke-width:2.5px;stroke-linejoin:round}
.hidden{opacity:0;pointer-events:none}
.top{position:absolute;left:16px;right:16px;top:14px;display:flex;gap:10px;align-items:center;pointer-events:none}
.card{background:var(--panel);border:1px solid #35524723;border-radius:16px;box-shadow:0 9px 30px #3552471d;backdrop-filter:blur(11px);pointer-events:auto}
.brand{padding:10px 13px;min-width:225px}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}
.search{flex:1;max-width:560px;padding:9px 12px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}
.controls{margin-left:auto;padding:7px;display:flex;gap:7px}.controls button{border:1px solid #35524725;background:#fffdf9;color:#24463c;border-radius:10px;padding:8px 10px}
#crumbs{position:absolute;left:16px;top:76px;display:flex;gap:5px;flex-wrap:wrap;max-width:72vw}.crumb{background:#fffdf9e9;border:1px solid #35524720;border-radius:999px;padding:5px 8px;font-size:10px;cursor:pointer}
.status{position:absolute;left:16px;bottom:16px;padding:9px 11px;font-size:10px;color:#536d64}
.zoom{position:absolute;right:16px;bottom:16px;padding:8px 10px;font-size:10px}
.level{position:absolute;right:16px;top:77px;padding:7px 10px;font-size:10px;color:#4d6b61}
</style></head>
<body><div id="app">
<svg id="map" viewBox="0 0 2400 1500">
<defs>
  <linearGradient id="oceanGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#48badd"/>
    <stop offset="48%" stop-color="#2ca4d0"/>
    <stop offset="100%" stop-color="#218fbe"/>
  </linearGradient>
  <radialGradient id="oceanGlow" cx="50%" cy="45%" r="70%">
    <stop offset="0%" stop-color="#8edbef" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#087aa8" stop-opacity=".05"/>
  </radialGradient>
</defs>
<rect class="sea" width="2400" height="1500"/>
<rect width="2400" height="1500" fill="url(#oceanGlow)"/>
<g class="grid">
  <path d="M-80 260 C440 170 840 335 1270 260 S2040 160 2480 280"/>
  <path d="M-90 520 C520 430 900 610 1430 515 S2070 470 2490 560"/>
  <path d="M-100 850 C470 760 980 920 1450 835 S2010 745 2490 890"/>
  <path d="M-120 1200 C520 1080 980 1260 1510 1175 S2080 1090 2510 1210"/>
</g>
<g id="halos"></g><g id="regions"></g><g id="labels"></g>
</svg>
<div class="top">
  <div class="card brand"><b>Atlas of Life</b><small>organische atlas · iNaturalist-gewogen taxonomie</small></div>
  <div class="card search"><input id="search" placeholder="Zoek taxon…" autocomplete="off"></div>
  <div class="card controls"><button id="home">Wereld</button></div>
</div>
<div id="crumbs"></div>
<div id="status" class="card status">taxonomie laden…</div>
<div id="level" class="card level">wereld</div>
<div id="zoom" class="card zoom">1.00×</div>
</div>
<script>
(async()=>{
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map');
const hg=document.getElementById('halos'), rg=document.getElementById('regions'), lg=document.getElementById('labels');
const status=document.getElementById('status'), zoomEl=document.getElementById('zoom');
const levelEl=document.getElementById('level'), crumbs=document.getElementById('crumbs');

const payload=await fetch('data/taxa.json',{cache:'no-store'}).then(r=>r.json());
const taxa=payload.taxa;
const byId=new Map(taxa.map(t=>[String(t.id),t]));

let roots=taxa.filter(t=>!t.parentId||!byId.has(String(t.parentId)));
if(roots.length>1){
  const life={id:'__life',parentId:null,canonicalName:'Life',rank:'ROOT',
    mapWeight:roots.reduce((a,t)=>a+Math.max(.0001,+t.mapWeight||+t.weight||1),0),depth:-1};
  taxa.push(life);byId.set(life.id,life);roots.forEach(t=>t.parentId=life.id);roots=[life];
}

const children=new Map();
taxa.forEach(t=>{const p=String(t.parentId);if(!children.has(p))children.set(p,[]);children.get(p).push(t)});

function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967295}
function h2(s,k=0){return hash(String(s)+'|'+k)}
function weight(t){return Math.max(.0001,+t.mapWeight||+t.weight||1)}

const rootPalette={
  Animalia:'#49bf98',
  Plantae:'#63bf63',
  Fungi:'#9a82cf',
  Bacteria:'#638fd4'
};
const rankFallback={DOMAIN:'#89abc0',KINGDOM:'#8fb9d4',PHYLUM:'#98c4ad',CLASS:'#acd19e',ORDER:'#cbd993',FAMILY:'#bdd7ad',GENUS:'#d0dfbd',SPECIES:'#e1ead8',ROOT:'#eef3eb'};

function tint(hex,f){
  let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  return`rgb(${Math.round(r+(255-r)*f)},${Math.round(g+(255-g)*f)},${Math.round(b+(255-b)*f)})`
}
function rootAncestor(t){
  let cur=t,last=t;
  while(cur&&cur.parentId&&byId.has(String(cur.parentId))){
    last=cur;
    const p=byId.get(String(cur.parentId));
    if(!p||p.id==='__life')break;
    cur=p;
  }
  return cur||last;
}
function colorFor(t){
  const root=rootAncestor(t);
  const rootName=root?.canonicalName;
  const base=rootPalette[rootName]||rankFallback[(t.rank||'').toUpperCase()]||'#a9cdb9';
  const d=Math.max(0,t.depth||0);
  const light=.035+.040*d+.12*h2(t.id,50);
  return tint(base,Math.min(.36,light));
}

function polygonArea(poly){let a=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];a+=p.x*q.y-q.x*p.y}return a/2}
function absArea(poly){return Math.abs(polygonArea(poly))}
function polygonCentroid(poly){let a=polygonArea(poly),cx=0,cy=0;if(Math.abs(a)<1e-8){let x=0,y=0;for(const p of poly){x+=p.x;y+=p.y}return{x:x/poly.length,y:y/poly.length}}for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],f=p.x*q.y-q.x*p.y;cx+=(p.x+q.x)*f;cy+=(p.y+q.y)*f}return{x:cx/(6*a),y:cy/(6*a)}}
function polyBBox(poly){let xs=poly.map(p=>p.x),ys=poly.map(p=>p.y);let x=Math.min(...xs),X=Math.max(...xs),y=Math.min(...ys),Y=Math.max(...ys);return{x,y,w:X-x,h:Y-y}}
function cleanPoly(poly){const out=[];for(const p of poly){const q=out[out.length-1];if(!q||Math.hypot(p.x-q.x,p.y-q.y)>.001)out.push({x:p.x,y:p.y})}if(out.length>2&&Math.hypot(out[0].x-out[out.length-1].x,out[0].y-out[out.length-1].y)<.001)out.pop();return out}


function pointInPoly(p,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i],b=poly[j];
    const hit=((a.y>p.y)!=(b.y>p.y)) &&
      (p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y+1e-12)+a.x);
    if(hit)inside=!inside;
  }
  return inside;
}

function organicBlob(cx,cy,rx,ry,id,detail=30){
  const pts=[];
  const phase=2*Math.PI*h2(id,7001);
  for(let i=0;i<detail;i++){
    const a=2*Math.PI*i/detail;
    /* Always <= 1, so the blob stays inside its collision ellipse. */
    let q=.87
      +.060*Math.sin(3*a+phase)
      +.035*Math.sin(5*a-phase*.6)
      +.024*Math.sin(8*a+phase*1.7)
      +.030*(h2(id,7100+i)-.5);
    q=Math.max(.72,Math.min(.985,q));
    pts.push({x:cx+Math.cos(a)*rx*q,y:cy+Math.sin(a)*ry*q});
  }
  return cleanPoly(pts);
}

function ellipseFits(poly,x,y,rx,ry){
  if(!pointInPoly({x,y},poly))return false;
  const n=18;
  for(let i=0;i<n;i++){
    const a=2*Math.PI*i/n;
    if(!pointInPoly({x:x+Math.cos(a)*rx,y:y+Math.sin(a)*ry},poly))return false;
  }
  return true;
}

function nudgeInside(poly,item,center){
  let tries=0;
  while(tries++<35 && !ellipseFits(poly,item.x,item.y,item.rx,item.ry)){
    item.x=item.x*.90+center.x*.10;
    item.y=item.y*.90+center.y*.10;
    if(tries%6===0){
      item.rx*=.94;item.ry*=.94;item.bound=Math.max(item.rx,item.ry);
    }
  }
}

function resolveCollisions(items,parentPoly,parentCenter){
  for(let pass=0;pass<145;pass++){
    for(let i=0;i<items.length;i++){
      const a=items[i];
      let fx=(parentCenter.x-a.x)*.0016,fy=(parentCenter.y-a.y)*.0016;
      for(let j=0;j<items.length;j++)if(i!==j){
        const b=items[j],dx=a.x-b.x,dy=a.y-b.y;
        const d=Math.hypot(dx,dy)||.001;
        const min=(a.bound+b.bound)*1.055;
        if(d<min){
          const push=(min-d)*.17;
          fx+=dx/d*push;fy+=dy/d*push;
        }
      }
      a.x+=fx;a.y+=fy;
      if(pass%4===0)nudgeInside(parentPoly,a,parentCenter);
    }
  }

  /* Final safety pass: shrink only stubborn conflicts. */
  for(let k=0;k<10;k++){
    let changed=false;
    for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
      const a=items[i],b=items[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<(a.bound+b.bound)*1.015){
        a.rx*=.965;a.ry*=.965;a.bound=Math.max(a.rx,a.ry);
        b.rx*=.965;b.ry*=.965;b.bound=Math.max(b.rx,b.ry);
        changed=true;
      }
    }
    for(const a of items)nudgeInside(parentPoly,a,parentCenter);
    if(!changed)break;
  }
}

function packChildren(parentPoly,items,depth,parentId){
  if(!items.length)return;
  const area=absArea(parentPoly),box=polyBBox(parentPoly),center=polygonCentroid(parentPoly);
  const total=items.reduce((s,t)=>s+weight(t),0);

  /* Deliberately leave open space, like seas/lakes between taxonomic regions. */
  const fillRatio=depth<=1?.59:depth===2?.66:depth===3?.72:.76;
  const usable=Math.max(1,area*fillRatio);

  const packed=items.map((t,i)=>{
    const share=weight(t)/total;
    const equivalent=Math.sqrt(usable*share/Math.PI);
    const asp=.88+.24*h2(t.id,7201);
    const rx=equivalent*Math.sqrt(asp);
    const ry=equivalent/Math.sqrt(asp);
    const ang=i*2.3999632297+2*Math.PI*h2(parentId,7300+i);
    const radial=.29*Math.min(box.w,box.h)*Math.sqrt((i+.65)/(items.length+.5));
    return{
      t,rx,ry,bound:Math.max(rx,ry),
      x:center.x+Math.cos(ang)*radial,
      y:center.y+Math.sin(ang)*radial
    };
  });

  /* If the first guess is too ambitious, shrink the complete family until it fits. */
  for(let round=0;round<8;round++){
    for(const p of packed)nudgeInside(parentPoly,p,center);
    resolveCollisions(packed,parentPoly,center);
    let bad=false;
    for(let i=0;i<packed.length;i++){
      if(!ellipseFits(parentPoly,packed[i].x,packed[i].y,packed[i].rx,packed[i].ry)){bad=true;break}
      for(let j=i+1;j<packed.length;j++){
        if(Math.hypot(packed[i].x-packed[j].x,packed[i].y-packed[j].y) <
           (packed[i].bound+packed[j].bound)*1.005){bad=true;break}
      }
      if(bad)break;
    }
    if(!bad)break;
    for(const p of packed){
      p.rx*=.92;p.ry*=.92;p.bound=Math.max(p.rx,p.ry);
      p.x=p.x*.94+center.x*.06;p.y=p.y*.94+center.y*.06;
    }
  }

  for(const p of packed){
    const t=p.t;
    t.depth=depth;
    t.poly=organicBlob(p.x,p.y,p.rx,p.ry,t.id,depth<2?36:28);
    t.cellPoly=t.poly;
    const cs=children.get(String(t.id))||[];
    if(cs.length)packChildren(t.poly,cs,depth+1,String(t.id));
  }
}

function rootContinent(box,t,targetArea){
  const cx=box.x+box.w/2,cy=box.y+box.h/2;
  /* Make the aspect ratio follow the anchor box while keeping area close to target. */
  const aspect=box.w/box.h;
  let rx=Math.sqrt(targetArea*aspect/Math.PI);
  let ry=Math.sqrt(targetArea/(aspect*Math.PI));
  const maxRx=box.w*.48,maxRy=box.h*.48;
  const s=Math.min(1,maxRx/rx,maxRy/ry);
  rx*=s;ry*=s;
  return organicBlob(cx,cy,rx,ry,t.id,46);
}

function layoutRootContinents(){
  const top=children.get(String(roots[0].id))||[];
  if(!top.length)return;

  /* Positions deliberately mirror the visual sketch. */
  const anchors={
    Plantae:{x:18,y:76,w:820,h:710},
    Animalia:{x:720,y:58,w:1640,h:950},
    Fungi:{x:18,y:835,w:800,h:610},
    Bacteria:{x:1590,y:1010,w:780,h:425}
  };
  const fallback=[
    {x:30,y:70,w:780,h:700},
    {x:770,y:60,w:1560,h:900},
    {x:30,y:850,w:740,h:560},
    {x:1650,y:1030,w:680,h:360}
  ];

  const sum=top.reduce((s,t)=>s+weight(t),0);
  const landBudget=2400*1500*.50;

  top.forEach((t,i)=>{
    const box=anchors[t.canonicalName]||fallback[i%fallback.length];
    const target=landBudget*(weight(t)/sum);
    t.depth=0;
    t.poly=rootContinent(box,t,target);
    t.cellPoly=t.poly;
    const cs=children.get(String(t.id))||[];
    if(cs.length)packChildren(t.poly,cs,1,String(t.id));
  });
}
layoutRootContinents();

function pathFromPoly(poly){
  if(!poly||poly.length<3)return'';
  const mids=poly.map((p,i)=>{const q=poly[(i+1)%poly.length];return{x:(p.x+q.x)/2,y:(p.y+q.y)/2}});
  let d=`M${mids[mids.length-1].x},${mids[mids.length-1].y}`;
  for(let i=0;i<poly.length;i++)d+=` Q${poly[i].x},${poly[i].y} ${mids[i].x},${mids[i].y}`;
  return d+'Z'
}
function minZoom(t){const d=Math.max(0,t.depth||0),rank=(t.rank||'').toUpperCase(),rankZ={DOMAIN:1,KINGDOM:1,PHYLUM:1.25,CLASS:1.65,ORDER:2.35,FAMILY:3.7,GENUS:5.5,SPECIES:8};return Math.max(rankZ[rank]||1.2,1+d*.56)}

const elems=[];
[...taxa].sort((a,b)=>(a.depth||0)-(b.depth||0)).forEach(t=>{
  if(t.id==='__life'||!t.poly||t.poly.length<3)return;
  t.box=polyBBox(t.poly);t.center=polygonCentroid(t.poly);t.area=absArea(t.poly);
  if((t.depth||0)===0){
    const haloWide=document.createElementNS(NS,'path');
    haloWide.setAttribute('d',pathFromPoly(t.poly));haloWide.setAttribute('class','continentHaloWide');haloWide.setAttribute('stroke-width','54');hg.appendChild(haloWide);
    const haloNear=document.createElementNS(NS,'path');
    haloNear.setAttribute('d',pathFromPoly(t.poly));haloNear.setAttribute('class','continentHaloNear');haloNear.setAttribute('stroke-width','16');hg.appendChild(haloNear);
  }
  const p=document.createElementNS(NS,'path');p.setAttribute('d',pathFromPoly(t.poly));p.setAttribute('fill',colorFor(t));p.setAttribute('class','taxonPath');p.setAttribute('stroke-width',Math.max(.9,6.5-(t.depth||0)*.72));p.dataset.minz=minZoom(t);p.dataset.id=t.id;p.onclick=e=>{e.stopPropagation();focus(t)};rg.appendChild(p);
  const text=document.createElementNS(NS,'text');text.setAttribute('x',t.center.x);text.setAttribute('y',t.center.y);text.setAttribute('text-anchor','middle');text.setAttribute('class','label');text.textContent=t.vernacularName||t.canonicalName;text.dataset.minz=(minZoom(t)*1.02);text.dataset.id=t.id;lg.appendChild(text);
  elems.push({t,p,text})
});

const world={x:0,y:0,w:2400,h:1500};
let view={...world},target={...world},ptr=new Map(),drag=false,last=null,pinch=null,lastSemantic=-1;
function fit(r){let ar=innerWidth/innerHeight,rr=r.w/r.h;if(rr>ar){let nh=r.w/ar,d=nh-r.h;r.y-=d/2;r.h=nh}else{let nw=r.h*ar,d=nw-r.w;r.x-=d/2;r.w=nw}}
function bbox(t){return t.box||polyBBox(t.poly)}
function focus(t){let r={...bbox(t)},pad=.2;r={x:r.x-r.w*pad,y:r.y-r.h*pad,w:r.w*(1+2*pad),h:r.h*(1+2*pad)};fit(r);target=r;renderCrumbs(t);if((t.rank||'').toUpperCase()==='ORDER'&&t.inatObservationCount!=null){levelEl.textContent=`orde · ${Number(t.inatObservationCount).toLocaleString('nl-NL')} iNat-waarnemingen · gewicht ${Number(t.inatAreaWeight||1).toFixed(2)}`}else levelEl.textContent=(t.rank||'taxon').toLowerCase()}
function home(){target={...world};fit(target);crumbs.innerHTML='';levelEl.textContent='wereld'}
document.getElementById('home').onclick=home;
function renderCrumbs(t){let arr=[];while(t&&t.id!=='__life'){arr.unshift(t);t=byId.get(String(t.parentId))}crumbs.innerHTML='';for(const x of arr){let s=document.createElement('span');s.className='crumb';s.textContent=x.canonicalName;s.onclick=()=>focus(x);crumbs.appendChild(s)}}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
document.getElementById('search').onkeydown=e=>{if(e.key!=='Enter')return;let q=norm(e.target.value),hit=taxa.find(t=>norm(t.canonicalName)===q)||taxa.find(t=>norm(t.vernacularName)===q)||taxa.find(t=>norm(t.canonicalName).includes(q));if(hit)focus(hit)}

function semantic(z){
  if(Math.abs(z-lastSemantic)<.08)return;lastSemantic=z;let deepest=0;
  for(const o of elems){
    const visible=z>=+o.p.dataset.minz;o.p.classList.toggle('hidden',!visible);if(visible)deepest=Math.max(deepest,o.t.depth||0);
    const screenW=(o.t.box?.w||0)*z,screenH=(o.t.box?.h||0)*z,labelVisible=visible&&z>=+o.text.dataset.minz&&screenW>62&&screenH>26;
    o.text.classList.toggle('hidden',!labelVisible);if(labelVisible){let fs=Math.max(8,Math.min(22,8.5+Math.sqrt(Math.max(20,Math.min(screenW,screenH)*2))/4.4));if((o.t.depth||0)===0)fs=Math.max(fs,29);else if((o.t.depth||0)===1)fs=Math.max(fs,19);o.text.setAttribute('font-size',fs/z)}
  }
  if(!crumbs.children.length){const names=['rijk/domein','stam','klasse','orde','familie','genus','soort'];levelEl.textContent=names[Math.min(names.length-1,Math.max(0,deepest))]||'wereld'}
}
svg.addEventListener('wheel',e=>{e.preventDefault();let r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height,wx=target.x+px*target.w,wy=target.y+py*target.h,f=Math.exp(e.deltaY*.0012);target.w=Math.max(24,Math.min(3000,target.w*f));target.h=Math.max(15,Math.min(1900,target.h*f));target.x=wx-px*target.w;target.y=wy-py*target.h},{passive:false});
svg.onpointerdown=e=>{svg.setPointerCapture?.(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1){drag=true;last={x:e.clientX,y:e.clientY}}if(ptr.size===2){let p=[...ptr.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),v:{...target},cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2};drag=false}};
