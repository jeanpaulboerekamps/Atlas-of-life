<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Atlas of Life — v69 directe persoonlijke heatmap</title>
<style>
:root{--sea:#1e9fd0;--ink:#17372f;--panel:#fffdf9f5;--muted:#60776e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sea);font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}
#app{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 40%,#54c4e2 0%,#29a9d4 45%,#1688bd 100%)}
svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.sea{fill:url(#oceanGradient)}
.grid{fill:none;stroke:#d7f4fb;stroke-width:2;opacity:.10;vector-effect:non-scaling-stroke}
.taxonPath{cursor:pointer;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:opacity .18s,filter .12s;filter:drop-shadow(0 1px 1px #052b3a14)}
.taxonPath:hover{filter:brightness(1.045)}
.speciesDot{fill-opacity:1!important;stroke:#303030!important;stroke-width:.42!important;filter:none!important}
/* v41: lightweight rendering while the user is actively navigating. */
svg.fastInteraction .taxonPath{filter:none!important}
svg.fastInteraction .label{display:none!important}
svg.fastInteraction .latin{display:none!important}
.continentHaloWide,.continentHaloNear{display:none}
.genusBoundary{display:none}

.label{font-weight:760;fill:#102f28;pointer-events:none;stroke:none;paint-order:normal}
.speciesLabelOnBlack{fill:#fffdf8}.speciesLabelOnWhite{fill:#111}
.speciesLabelObserved{fill:#fff}
.personalLegend{position:absolute;right:16px;top:76px;padding:8px 11px;font-size:11px;
  color:#123b55;display:none}.personalLegend .swatch{display:inline-block;width:10px;height:10px;
  border-radius:50%;background:#087fd1;margin-right:6px;vertical-align:-1px}
.hidden{opacity:0;pointer-events:none}
.top{position:absolute;left:16px;right:16px;top:14px;display:flex;gap:10px;align-items:center;pointer-events:none}
.card{background:var(--panel);border:1px solid #35524723;border-radius:16px;box-shadow:0 9px 30px #3552471d;backdrop-filter:blur(11px);pointer-events:auto}
.brand{padding:10px 13px;min-width:225px}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}
.search{flex:1;max-width:560px;padding:9px 12px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}
.controls{margin-left:auto;padding:7px;display:flex;gap:7px}.controls button{border:1px solid #35524725;background:#fffdf9;color:#24463c;border-radius:10px;padding:8px 10px}
#crumbs{position:absolute;left:16px;top:76px;display:flex;gap:5px;flex-wrap:wrap;max-width:72vw}.crumb{background:#fffdf9e9;border:1px solid #35524720;border-radius:999px;padding:5px 8px;font-size:10px;cursor:pointer}
.status{position:absolute;left:16px;bottom:16px;padding:9px 11px;font-size:10px;color:#536d64}
.zoom{position:absolute;right:16px;bottom:16px;padding:8px 10px;font-size:10px}
.level{position:absolute;right:16px;top:77px;padding:7px 10px;font-size:10px;color:#4d6b61}
</style></head>
<body><div id="app">
<svg id="map" viewBox="0 0 2400 1500">
<defs>
  <linearGradient id="oceanGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#43bee3"/>
    <stop offset="46%" stop-color="#22a7d4"/>
    <stop offset="100%" stop-color="#1186ba"/>
  </linearGradient>
  <radialGradient id="oceanGlow" cx="50%" cy="42%" r="72%">
    <stop offset="0%" stop-color="#b6eff8" stop-opacity=".22"/>
    <stop offset="52%" stop-color="#55c6e2" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#0478a8" stop-opacity=".10"/>
  </radialGradient>
  <filter id="landTexture" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.020" numOctaves="2" seed="7" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
    <feComponentTransfer in="grey" result="soft">
      <feFuncA type="table" tableValues="0 0 .13"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="soft" mode="soft-light"/>
  </filter>
  <!-- Five procedural octaves add effectively unlimited coastline detail without
       multiplying the 1,551 order polygons into millions of DOM coordinates. -->
  <filter id="coastRealm" x="-5%" y="-7%" width="110%" height="114%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".006 .009" numOctaves="5" seed="31" result="coastNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="coastNoise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="coastPhylum" x="-4%" y="-6%" width="108%" height="112%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".012 .018" numOctaves="5" seed="47" result="coastNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="coastNoise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="coastClass" x="-3%" y="-5%" width="106%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".022 .031" numOctaves="5" seed="63" result="coastNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="coastNoise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="coastOrder" x="-3%" y="-4%" width="106%" height="108%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".040 .057" numOctaves="5" seed="79" result="coastNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="coastNoise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect class="sea" width="2400" height="1500"/>
<rect width="2400" height="1500" fill="url(#oceanGlow)"/>
<g class="grid">
  <path d="M-80 260 C440 170 840 335 1270 260 S2040 160 2480 280"/>
  <path d="M-90 520 C520 430 900 610 1430 515 S2070 470 2490 560"/>
  <path d="M-100 850 C470 760 980 920 1450 835 S2010 745 2490 890"/>
  <path d="M-120 1200 C520 1080 980 1260 1510 1175 S2080 1090 2510 1210"/>
</g>
<g id="halos"></g><g id="regions"></g><g id="genusOverlays"></g><g id="labels"></g>
</svg>
<div class="top">
  <div class="card brand"><b>Atlas of Life</b><small>v69 · directe persoonlijke biodiversiteitslaag</small></div>
  <div class="card search"><input id="search" placeholder="Zoek taxon…" autocomplete="off"></div>
  <div class="card controls"><button id="home">Wereld</button></div>
</div>
<div id="crumbs"></div>
<div id="status" class="card status">taxonomie laden…</div>
<div id="level" class="card level">wereld</div>
<div id="zoom" class="card zoom">1.00×</div>
<div id="personalLegend" class="card personalLegend"><span class="swatch"></span><span></span></div>
</div>
<script>
(async()=>{try{
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map');
const hg=document.getElementById('halos'), rg=document.getElementById('regions'), og=document.getElementById('genusOverlays'), lg=document.getElementById('labels');
const status=document.getElementById('status'), zoomEl=document.getElementById('zoom');
const levelEl=document.getElementById('level'), crumbs=document.getElementById('crumbs');
const personalLegend=document.getElementById('personalLegend');

const payload=await fetch('data/taxa.json',{cache:'no-store'}).then(r=>r.json());
const taxa=payload.taxa;
const byId=new Map(taxa.map(t=>[String(t.id),t]));

let roots=taxa.filter(t=>!t.parentId||!byId.has(String(t.parentId)));

/* The observation export can omit kingdoms with no mapped records. Keep all
     eight iNaturalist kingdoms visible; absent ones become labelled empty
     islands and receive the same fixed 0.5% allocation as the other small realms. */
const requiredKingdoms=['Animalia','Plantae','Fungi','Bacteria','Archaea','Chromista','Protozoa','Viruses'];
const sourceLife=roots.length===1&&String(roots[0].canonicalName||'').toLowerCase()==='life'
  ? roots[0]
  : null;
for(const name of requiredKingdoms){
  const present=taxa.some(t=>['KINGDOM','DOMAIN'].includes((t.rank||'').toUpperCase())&&t.canonicalName===name);
  if(!present){
    const kingdom={id:'__kingdom_'+name.toLowerCase(),parentId:sourceLife?.id||null,
      canonicalName:name,rank:'KINGDOM',mapWeight:.0001,weight:.0001,depth:0};
    taxa.push(kingdom);byId.set(String(kingdom.id),kingdom);
  }
}
roots=taxa.filter(t=>!t.parentId||!byId.has(String(t.parentId)));
if(roots.length>1){
  const life={id:'__life',parentId:null,canonicalName:'Life',rank:'ROOT',
    mapWeight:roots.reduce((a,t)=>a+Math.max(.0001,+t.mapWeight||+t.weight||1),0),depth:-1};
  taxa.push(life);byId.set(life.id,life);roots.forEach(t=>t.parentId=life.id);roots=[life];
}

const children=new Map();
taxa.forEach(t=>{const p=String(t.parentId);if(!children.has(p))children.set(p,[]);children.get(p).push(t)});

function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967295}
function h2(s,k=0){return hash(String(s)+'|'+k)}
function weight(t){return Math.max(.0001,+t.mapWeight||+t.weight||1)}

const levelPalettes={
  /* rijk, stam, klasse, orde, familie, geslacht, soort */
  Animalia:['#78182b','#94202e','#ae2b30','#c83b2f','#df522d','#ee722d','#f39a38'],
  Plantae:['#075d3b','#08753d','#188a3b','#3ca03a','#68b536','#9cc936','#d5d944'],
  Fungi:['#3f205d','#522675','#652d8c','#7937a3','#9044b8','#aa57ca','#c875dc'],
  Bacteria:['#65431f','#7b5225','#93632c','#ac7735','#c38d42','#d8a65a','#e8c07a'],
  Archaea:['#101010','#202020','#303030','#424242','#555555','#6a6a6a','#808080'],
  Chromista:['#8f285f','#a93574','#c14389','#d7559f','#e66db2','#ef8bc4','#f5add6'],
  Protozoa:['#006c70','#007f82','#009396','#16a8aa','#3bbabd','#69ccce','#98dddd'],
  Viruses:['#d8d8d4','#dfdfdc','#e6e6e3','#ececea','#f2f2f0','#f8f8f6','#ffffff']
};
const rankFallback={DOMAIN:'#89abc0',KINGDOM:'#8fb9d4',PHYLUM:'#98c4ad',CLASS:'#acd19e',ORDER:'#cbd993',FAMILY:'#bdd7ad',GENUS:'#d0dfbd',SPECIES:'#e1ead8',ROOT:'#eef3eb'};

function tint(hex,f){
  let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  return`rgb(${Math.round(r+(255-r)*f)},${Math.round(g+(255-g)*f)},${Math.round(b+(255-b)*f)})`
}
function rootAncestor(t){
  let cur=t,last=t;
  while(cur&&cur.parentId&&byId.has(String(cur.parentId))){
    last=cur;
    const p=byId.get(String(cur.parentId));
    if(!p||p.id==='__life')break;
    cur=p;
  }
  return cur||last;
}
function colorFor(t){
  const root=rootAncestor(t);
  const rootName=root?.canonicalName;
  const r=(t.rank||'').toUpperCase();
  const level={DOMAIN:0,KINGDOM:0,PHYLUM:1,CLASS:2,ORDER:3,FAMILY:4,GENUS:5,SPECIES:6}[r];
  const palette=levelPalettes[rootName];
  if(palette&&level!==undefined)return palette[level];
  return rankFallback[r]||'#a9cdb9';
}

function mixHex(a,b,t){
  const av=parseInt(a.slice(1),16),bv=parseInt(b.slice(1),16);
  const ar=av>>16,ag=(av>>8)&255,ab=av&255;
  const br=bv>>16,bg=(bv>>8)&255,bb=bv&255;
  const c=x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0');
  return'#'+c(ar+(br-ar)*t)+c(ag+(bg-ag)*t)+c(ab+(bb-ab)*t);
}

const gradientCache=new Map();
function levelNumber(t){
  return{DOMAIN:0,KINGDOM:0,PHYLUM:1,CLASS:2,ORDER:3,FAMILY:4,GENUS:5,SPECIES:6}[(t.rank||'').toUpperCase()];
}
function edgeColorFor(t){
  const root=rootAncestor(t);
  const palette=levelPalettes[root?.canonicalName];
  const level=levelNumber(t);
  if(!palette||level===undefined)return colorFor(t);
  return level===0?'#22a7d4':palette[level-1];
}
function fillFor(t){
  const root=rootAncestor(t);
  const rootName=root?.canonicalName;
  const palette=levelPalettes[rootName];
  const level=levelNumber(t);
  if(!palette||level===undefined)return colorFor(t);

  const key=rootName+'-'+level;
  if(!gradientCache.has(key)){
    const own=palette[level],edge=level===0?'#22a7d4':palette[level-1];
    const id='level-gradient-'+rootName.toLowerCase()+'-'+level;
    const gradient=document.createElementNS(NS,'radialGradient');
    gradient.setAttribute('id',id);
    if(level===0){
      /* v39: the root gradient radius reaches the rectangle corners.
         This removes the broad dark/blurred-looking wedges in large kingdoms. */
      gradient.setAttribute('cx','50%');gradient.setAttribute('cy','50%');
      gradient.setAttribute('r','72%');gradient.setAttribute('fx','50%');gradient.setAttribute('fy','50%');
    }else{
      gradient.setAttribute('cx','50%');gradient.setAttribute('cy','48%');
      gradient.setAttribute('r','52%');gradient.setAttribute('fx','48%');gradient.setAttribute('fy','46%');
    }
    const stops = level===0
      ? [ /* v39: almost the whole realm keeps its own colour */
          ['0%',own],['84%',own],['92%',mixHex(own,edge,.14)],
          ['97%',mixHex(own,edge,.42)],['100%',edge]
        ]
      : [
          ['0%',own],['48%',own],['72%',mixHex(own,edge,.28)],
          ['88%',mixHex(own,edge,.68)],['100%',edge]
        ];
    for(const [offset,colour] of stops){
      const stop=document.createElementNS(NS,'stop');
      stop.setAttribute('offset',offset);stop.setAttribute('stop-color',colour);
      gradient.appendChild(stop);
    }
    svg.querySelector('defs').appendChild(gradient);
    gradientCache.set(key,id);
  }
  return'url(#'+gradientCache.get(key)+')';
}

function polygonArea(poly){let a=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];a+=p.x*q.y-q.x*p.y}return a/2}
function absArea(poly){return Math.abs(polygonArea(poly))}
function polygonCentroid(poly){let a=polygonArea(poly),cx=0,cy=0;if(Math.abs(a)<1e-8){let x=0,y=0;for(const p of poly){x+=p.x;y+=p.y}return{x:x/poly.length,y:y/poly.length}}for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],f=p.x*q.y-q.x*p.y;cx+=(p.x+q.x)*f;cy+=(p.y+q.y)*f}return{x:cx/(6*a),y:cy/(6*a)}}
function polyBBox(poly){let xs=poly.map(p=>p.x),ys=poly.map(p=>p.y);let x=Math.min(...xs),X=Math.max(...xs),y=Math.min(...ys),Y=Math.max(...ys);return{x,y,w:X-x,h:Y-y}}
function cleanPoly(poly){const out=[];for(const p of poly){const q=out[out.length-1];if(!q||Math.hypot(p.x-q.x,p.y-q.y)>.001)out.push({x:p.x,y:p.y})}if(out.length>2&&Math.hypot(out[0].x-out[out.length-1].x,out[0].y-out[out.length-1].y)<.001)out.pop();return out}


function pointInPoly(p,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i],b=poly[j];
    const hit=((a.y>p.y)!=(b.y>p.y)) &&
      (p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y+1e-12)+a.x);
    if(hit)inside=!inside;
  }
  return inside;
}


function organicBlob(cx,cy,rx,ry,id,detail=44){
  const pts=[];
  const phase=2*Math.PI*h2(id,7001);

  for(let i=0;i<detail;i++){
    const a=2*Math.PI*i/detail;

    /* v20: high-fill organic coast.
       Broad lobes and bays remain, but the average radius is close to 1.
       This means a 95% ellipse packing becomes roughly 85–90% real land. */
    let q=.948
      +.032*Math.sin(2*a+phase*.55)
      +.026*Math.sin(3*a+phase)
      +.020*Math.sin(5*a-phase*.72)
      +.014*Math.sin(8*a+phase*1.6)
      +.010*Math.sin(13*a-phase*.3)
      +.014*(h2(id,7100+i)-.5);

    const bay=h2(id,7600+i);
    if(bay>.91)q-=.050+.025*h2(id,7700+i);
    if(bay<.06)q+=.012*h2(id,7800+i);

    q=Math.max(.80,Math.min(.997,q));

    const yWarp=.985
      +.020*Math.sin(2*a+phase*.30)
      +.010*Math.sin(4*a-phase*.2);

    pts.push({
      x:cx+Math.cos(a)*rx*q,
      y:cy+Math.sin(a)*ry*q*yWarp
    });
  }
  return cleanPoly(pts);
}

function pointInPoly(p,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i],b=poly[j];
    const hit=((a.y>p.y)!=(b.y>p.y)) &&
      (p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y+1e-12)+a.x);
    if(hit)inside=!inside;
  }
  return inside;
}
function ellipseFits(poly,x,y,rx,ry){
  if(!pointInPoly({x,y},poly))return false;
  const n=20;
  for(let i=0;i<n;i++){
    const a=2*Math.PI*i/n;
    if(!pointInPoly({x:x+Math.cos(a)*rx,y:y+Math.sin(a)*ry},poly))return false;
  }
  return true;
}
function nudgeInside(poly,item,center){
  let tries=0;
  while(tries++<38&&!ellipseFits(poly,item.x,item.y,item.rx,item.ry)){
    item.x=item.x*.91+center.x*.09;
    item.y=item.y*.91+center.y*.09;
    if(tries%6===0){
      item.rx*=.95;item.ry*=.95;item.bound=Math.max(item.rx,item.ry);
    }
  }
}

function ellipseRadiusToward(item,dx,dy){
  const d=Math.hypot(dx,dy)||1;
  const ux=dx/d,uy=dy/d;
  return 1/Math.sqrt(
    (ux*ux)/(item.rx*item.rx+1e-9) +
    (uy*uy)/(item.ry*item.ry+1e-9)
  );
}
function ellipsePairLimit(a,b,dx,dy){
  return ellipseRadiusToward(a,dx,dy)+ellipseRadiusToward(b,-dx,-dy);
}

function resolveCollisions(items,parentPoly,parentCenter){
  for(let pass=0;pass<230;pass++){
    for(let i=0;i<items.length;i++){
      const a=items[i];
      let fx=(parentCenter.x-a.x)*.0012,fy=(parentCenter.y-a.y)*.0012;
      for(let j=0;j<items.length;j++)if(i!==j){
        const b=items[j],dx=a.x-b.x,dy=a.y-b.y;
        const d=Math.hypot(dx,dy)||.001;
        const min=ellipsePairLimit(a,b,dx,dy)*1.006;
        if(d<min){
          const push=(min-d)*.19;
          fx+=dx/d*push;fy+=dy/d*push;
        }
      }
      a.x+=fx;a.y+=fy;
      if(pass%4===0)nudgeInside(parentPoly,a,parentCenter);
    }
  }
}

function addSatelliteIslands(parentPoly,parentId,depth){
  /* purely decorative tiny islands; no taxon ownership, pointer-events disabled */
  const b=polyBBox(parentPoly),c=polygonCentroid(parentPoly);
  const count=depth<=1?7:depth===2?4:0;
  const sats=[];
  for(let i=0;i<count;i++){
    const a=2*Math.PI*h2(parentId,9000+i);
    const rr=.42+.42*h2(parentId,9050+i);
    const x=c.x+Math.cos(a)*b.w*.50*rr;
    const y=c.y+Math.sin(a)*b.h*.50*rr;
    const r=Math.max(4,Math.min(b.w,b.h)*(.018+.018*h2(parentId,9100+i)));
    if(pointInPoly({x,y},parentPoly))continue;
    sats.push({x,y,r,id:parentId+'sat'+i});
  }
  return sats;
}

function packChildren(parentPoly,items,depth,parentId){
  if(!items.length)return;

  const area=absArea(parentPoly),box=polyBBox(parentPoly),center=polygonCentroid(parentPoly);
  const total=items.reduce((s,t)=>s+weight(t),0);

  /* v22: packing depends on the CHILD rank.
     Classes were the main source of empty space, so they get the
     highest fill target and the most compact initial placement. */
  const childRank=((items[0]?.rank)||'').toUpperCase();

  const fillRatio =
    childRank==='CLASS' ? .992 :
    childRank==='ORDER' ? .975 :
    childRank==='PHYLUM'? .980 :
    childRank==='FAMILY'? .965 :
    depth<=1 ? .975 :
    depth===2 ? .972 : .965;

  const radialFactor =
    childRank==='CLASS' ? .105 :
    childRank==='ORDER' ? .220 :
    childRank==='PHYLUM'? .185 :
    .255;

  const wobbleFactor =
    childRank==='CLASS' ? .020 :
    childRank==='ORDER' ? .045 :
    childRank==='PHYLUM'? .032 :
    .060;

  const usable=Math.max(1,area*fillRatio);

  const packed=items.map((t,i)=>{
    const share=weight(t)/total;
    const equivalent=Math.sqrt(usable*share/Math.PI);

    /* Classes stay more compact / less elongated so they tessellate
       more efficiently inside a phylum such as Chordata. */
    const asp = childRank==='CLASS'
      ? .88+.24*h2(t.id,7201)
      : .72+.58*h2(t.id,7201);

    const rx=equivalent*Math.sqrt(asp);
    const ry=equivalent/Math.sqrt(asp);

    const ang=i*2.3999632297+2*Math.PI*h2(parentId,7300+i);
    const radial=radialFactor*Math.min(box.w,box.h)*Math.sqrt((i+.35)/(items.length+.15));
    const wobble=wobbleFactor*Math.min(box.w,box.h);

    return{
      t,rx,ry,bound:Math.max(rx,ry),
      x:center.x+Math.cos(ang)*radial+(h2(t.id,7401)-.5)*wobble,
      y:center.y+Math.sin(ang)*radial+(h2(t.id,7402)-.5)*wobble

function rootContinent(box,t,targetArea){
  const cx=box.x+box.w/2,cy=box.y+box.h/2;
  const aspect=box.w/box.h;

  let rx=Math.sqrt(targetArea*aspect/Math.PI);
  let ry=Math.sqrt(targetArea/(aspect*Math.PI));

  /* Keep ocean between continents like the sketch. */
  const maxRx=box.w*.455,maxRy=box.h*.455;
  const s=Math.min(1,maxRx/rx,maxRy/ry);
  rx*=s;ry*=s;

  /* Shift slightly to break a rigid grid composition. */
  const jx=(h2(t.id,9500)-.5)*box.w*.06;
  const jy=(h2(t.id,9501)-.5)*box.h*.06;

  return organicBlob(cx+jx,cy+jy,rx,ry,t.id,54);

function layoutRootContinents(){
  const top=children.get(String(roots[0].id))||[];
  if(!top.length)return;

  /* Approximate composition of the illustrated sketch, but the continents
     are now packed against one another instead of living in isolated boxes. */
  const preferred={
    Plantae:{x:520,y:440},
    Animalia:{x:1540,y:500},
    Fungi:{x:470,y:1120},
    Bacteria:{x:1770,y:1160}
  };

  const total=top.reduce((s,t)=>s+weight(t),0);
  const worldArea=2400*1500;

  /* Much more land than v16: only ~22% of the canvas is deliberate ocean. */
  const landBudget=worldArea*.78;

  const items=top.map((t,i)=>{
    const share=weight(t)/total;
    const area=landBudget*share;

    /* preserve broad visual character while letting weights control size */
    const aspect=t.canonicalName==='Animalia'?1.55:
                 t.canonicalName==='Plantae'?1.18:
                 t.canonicalName==='Fungi'?1.25:1.42;

    let rx=Math.sqrt(area*aspect/Math.PI);
    let ry=Math.sqrt(area/(aspect*Math.PI));

    const p=preferred[t.canonicalName]||{
      x:500+450*i,
      y:i<2?430:1110
    };

    return{
      t,x:p.x,y:p.y,rx,ry,bound:Math.max(rx,ry)
    };
  });

  /* Scale all roots together until their collision ellipses can fit
     comfortably in the viewport. */
  for(let scaleRound=0;scaleRound<9;scaleRound++){
    let bad=false;

    for(let pass=0;pass<150;pass++){
      for(let i=0;i<items.length;i++){
        const a=items[i];
        const pref=preferred[a.t.canonicalName]||{x:a.x,y:a.y};

        let fx=(pref.x-a.x)*.018;
        let fy=(pref.y-a.y)*.018;

        for(let j=0;j<items.length;j++)if(i!==j){
          const b=items[j];
          const dx=a.x-b.x,dy=a.y-b.y;
          const d=Math.hypot(dx,dy)||.001;
          const min=(a.bound+b.bound)*.80;  // close, slightly interlocking appearance
          if(d<min){
            const push=(min-d)*.15;
            fx+=dx/d*push;fy+=dy/d*push;

        const pad=24;
        if(a.x-a.rx<pad)fx+=(pad-(a.x-a.rx))*.10;
        if(a.x+a.rx>2400-pad)fx-=((a.x+a.rx)-(2400-pad))*.10;
        if(a.y-a.ry<pad)fy+=(pad-(a.y-a.ry))*.10;
        if(a.y+a.ry>1500-pad)fy-=((a.y+a.ry)-(1500-pad))*.10;

        a.x+=fx;a.y+=fy;
      }
    }

    for(let i=0;i<items.length;i++){
      const a=items[i];
      if(a.x-a.rx<10||a.x+a.rx>2390||a.y-a.ry<10||a.y+a.ry>1490){bad=true;break}
      for(let j=i+1;j<items.length;j++){
        const b=items[j];
        if(Math.hypot(a.x-b.x,a.y-b.y)<(a.bound+b.bound)*.77){bad=true;break}
      }
      if(bad)break;
    }

    if(!bad)break;
    for(const a of items){
      a.rx*=.94;a.ry*=.94;a.bound=Math.max(a.rx,a.ry);
    }

    const t=a.t;
    t.depth=0;
    t.poly=organicBlob(a.x,a.y,a.rx,a.ry,t.id,58);
    t.cellPoly=t.poly;

    const cs=children.get(String(t.id))||[];
    if(cs.length)packChildren(t.poly,cs,1,String(t.id));

layoutRootContinents();

/* v19 hard rule: at world level, open water must not exceed 15%.

   centroids until their summed polygon area reaches at least 85% of the
   2400x1500 world canvas.  Scaling is capped per step to keep the layout stable. */

  return poly.map(p=>({x:c.x+(p.x-c.x)*f,y:c.y+(p.y-c.y)*f}));
}
function topLevelLandFraction(){

     A deterministic sampling grid is accurate enough for the status/enforcer
     and avoids the misleading double-counting used in v19/v20. */
  const rootsNow=(children.get(String(roots[0].id))||[]).filter(t=>t.poly&&t.poly.length>=3);
  const NX=180,NY=112;
  let land=0,total=NX*NY;
  for(let iy=0;iy<NY;iy++){
    const y=(iy+.5)*1500/NY;
    for(let ix=0;ix<NX;ix++){
      const x=(ix+.5)*2400/NX;
      let hit=false;
      for(const t of rootsNow){
        if(pointInPoly({x,y},t.poly)){hit=true;break}
      }
      if(hit)land++;
    }
  }
  return land/total;
}

  const target=.885;

  for(let round=0;round<18 && frac<target;round++){
    /* theoretical scale needed if there were no clipping */
    const desired=Math.sqrt(target/Math.max(.001,frac));
    const f=Math.min(1.055,Math.max(1.008,desired));

    for(const t of top){
      const c=polygonCentroid(t.poly);
      let grown=scalePolyAbout(t.poly,c,f);

      /* Clamp to the world rectangle with a 6px safety margin. */
      grown=grown.map(p=>({
        x:Math.max(6,Math.min(2394,p.x)),
        y:Math.max(6,Math.min(1494,p.y))
      }));
      t.poly=cleanPoly(grown);
      t.cellPoly=t.poly;
    }
    frac=topLevelLandFraction();
  }

  payload.meta=payload.meta||{};
  payload.meta.worldLandFraction=frac;

     Each pair gets two parallel half-plane cuts with a narrow ocean gap.
     This guarantees separation instead of merely translating polygons. */
  function clipHalfPlane(poly,nx,ny,c,keepLow){
    const val=p=>p.x*nx+p.y*ny;
    const inside=p=>keepLow?val(p)<=c+1e-7:val(p)>=c-1e-7;
    const out=[];
    for(let i=0;i<poly.length;i++){
      const a=poly[i],b=poly[(i+1)%poly.length];
      const va=val(a),vb=val(b),ia=inside(a),ib=inside(b);
      if(ia)out.push({x:a.x,y:a.y});

  }

    /* Start from the enlarged polygons each time. */
    const working=new Map(top.map(t=>[String(t.id),t.poly.map(p=>({x:p.x,y:p.y}))]));

    for(let i=0;i<top.length;i++){
      for(let j=i+1;j<top.length;j++){
        const A=top[i],B=top[j];
        let pa=working.get(String(A.id)),pb=working.get(String(B.id));
        if(!pa||!pb||pa.length<3||pb.length<3)continue;

        const ca=polygonCentroid(pa),cb=polygonCentroid(pb);
        let nx=cb.x-ca.x,ny=cb.y-ca.y;
        const nd=Math.hypot(nx,ny)||1;

        const mb=cb.x*nx+cb.y*ny;

        const qa=clipHalfPlane(pa,nx,ny,mid-gap/2,true);
        const qb=clipHalfPlane(pb,nx,ny,mid+gap/2,false);

        if(qb.length>=3)working.set(String(B.id),qb);

    const f=topLevelLandFraction();
    if(f>=.85){best={gap,polys:separated,frac:f};break}

    best={gap:3,polys:separated,frac:0};
  }

  for(const t of top){
    const p=best.polys.get(String(t.id));
    if(p&&p.length>=3)t.poly=t.cellPoly=p;
  }

  frac=topLevelLandFraction();
  payload.meta.worldLandFraction=frac;
  payload.meta.rootOceanGap=best.gap;

})();

  let x=0,y=0;

  return{x:x/cloud.length,y:y/cloud.length};

  if(cloud.length<3)return cloud.slice();

  const TAU=Math.PI*2;

  for(const p of cloud){
    let a=Math.atan2(p.y-c.y,p.x-c.x);
    if(a<0)a+=TAU;
    const k=Math.min(N-1,Math.floor(a/TAU*N));
    const r=Math.hypot(p.x-c.x,p.y-c.y);
    if(r>bins[k])bins[k]=r;
  }

  /* Fill empty angular bins by circular interpolation. */
  for(let pass=0;pass<N;pass++){
    let changed=false;
    for(let i=0;i<N;i++)if(!bins[i]){
      const a=bins[(i-1+N)%N],b=bins[(i+1)%N];
      if(a&&b){bins[i]=(a+b)/2;changed=true}
      else if(a){bins[i]=a;changed=true}
      else if(b){bins[i]=b;changed=true}
    }
    if(!changed)break;
  }

  /* Neighbor dilation ensures every child vertex sits inside the connecting
     edges, while remaining much tighter than a convex hull. */
  const rad=bins.map((r,i)=>{
    let m=r;
    for(let d=-2;d<=2;d++)m=Math.max(m,bins[(i+d+N)%N]||0);
    return m;
  });

  let best=null;
  for(let margin=marginMin;margin<=marginMax+.0001;margin+=.004){
    const poly=[];
    for(let i=0;i<N;i++){
      const a=(i+.5)/N*TAU;
      const rough=1+.006*Math.sin(i*.83+6.28*h2(id,14000));
      const r=rad[i]*margin*rough;
      poly.push({x:c.x+Math.cos(a)*r,y:c.y+Math.sin(a)*r});
    }
    let ok=true;
    for(const p of cloud){
      if(!pointInPoly(p,poly)){ok=false;break}
    }
    if(ok){best=poly;break}
  }

const depthSorted=[...taxa]
  .filter(t=>t.id!=='__life'&&t.poly)
  .sort((a,b)=>(b.depth||0)-(a.depth||0));

for(const t of depthSorted){
  const cs=(children.get(String(t.id))||[]).filter(c=>c.poly&&c.poly.length>=3);
  if(!cs.length||(t.depth||0)===0)continue;

  const cloud=[];
  for(const c of cs){
    /* all vertices, not sparse samples: parent must truly contain every child */
    for(const p of c.poly)cloud.push(p);
  }
  if(cloud.length<3)continue;

  const firstRank=(cs[0]?.rank||'').toUpperCase();
  const env = firstRank==='CLASS'
    ? starEnvelope(cloud,t.id,1.003,1.035)
    : firstRank==='ORDER'
      ? starEnvelope(cloud,t.id,1.006,1.050)
      : starEnvelope(cloud,t.id,1.010,1.080);

  if(env&&env.length>=3){

  }

function computeRecursiveCoverage(){
  let worst=1,worstName='',worstChildRank='';
  for(const t of taxa){
    if(!t.poly||t.id==='__life')continue;
    const cs=(children.get(String(t.id))||[]).filter(c=>c.poly&&c.poly.length>=3);
    if(!cs.length){
      t.childLandFraction=null;
      continue;
    }
    const parentArea=Math.max(1e-9,absArea(t.poly));
    const childArea=cs.reduce((s,c)=>s+absArea(c.poly),0);
    t.childLandFraction=Math.max(0,Math.min(1,childArea/parentArea));
    if(t.childLandFraction<worst){
      worst=t.childLandFraction;worstName=t.canonicalName||'';worstChildRank=(cs[0]?.rank||'').toUpperCase();
    }
  }

  payload.meta.worstChildLandFraction=worst;
  payload.meta.worstChildTaxon=worstName;

   - Below ORDER, layout continues top-down with the native taxon weights.
   - Every sibling partition covers its parent exactly; each visible child

      const hind=.36*anglePulse(a,-2.34,.40)+.36*anglePulse(a,2.34,.40);
      const waist=.11*anglePulse(a,0,.12)+.11*anglePulse(a,Math.PI,.12);

      /* Dragonfly: four long diagonal wings around a very narrow body. */
      return .40+.54*Math.pow(Math.abs(Math.sin(2*a)),2.15)
        +.10*anglePulse(a,0,.18)+.16*anglePulse(a,Math.PI,.16);
    }

      /* Fly: a bulbous head, two very large wings and a tapered abdomen. */

        +.45*anglePulse(a,-1.55,.33)+.45*anglePulse(a,1.55,.33)

        +.42*anglePulse(a,-1.34,.30)+.42*anglePulse(a,1.34,.30)

        case 0:return .70+s*(.18*Math.cos(3*a+phase)+.07*Math.cos(7*a-phase));

        case 2:return .69+s*(.15*Math.cos(5*a+phase)+.09*Math.sin(2*a-phase));
        case 3:return .70+s*(.17*Math.cos(4*a-phase)+.10*Math.sin(3*a+phase));
        case 4:return .72+s*(.19*Math.sin(2*a+phase)-.12*Math.cos(6*a-phase));
        case 5:return .69+s*(.14*Math.sin(6*a+phase)+.11*Math.sin(3*a-phase));
        default:return .70+s*(.16*Math.sin(3*a+phase)+.12*Math.sin(7*a-phase));

    return .890
      +.035*Math.sin(2*a+6.28*h2(t.id,17100))
      +.025*Math.sin(5*a+6.28*h2(t.id,17200))
      +.015*Math.sin(9*a+6.28*h2(t.id,17300));

  function rayToCellRadius(cell,c,a){
    const dx=Math.cos(a),dy=Math.sin(a);
    let nearest=Infinity;

    for(let i=0;i<cell.length;i++){
      const p=cell[i],q=cell[(i+1)%cell.length];
      const ex=q.x-p.x,ey=q.y-p.y;
      const den=dx*ey-dy*ex;
      if(Math.abs(den)<1e-10)continue;

      const px=p.x-c.x,py=p.y-c.y;
      const distance=(px*ey-py*ex)/den;
      const along=(px*dy-py*dx)/den;
      if(distance>=0&&along>=-1e-7&&along<=1+1e-7){
        nearest=Math.min(nearest,distance);
      }
    }
    return Number.isFinite(nearest)?nearest:0;
  }

  function shapeFromCell(cell,t,target=.85){
    if(!cell||cell.length<3)return cell;

    const c=polygonCentroid(cell);
    const rank=(t.rank||'').toUpperCase();
    const isOrder=rank==='ORDER';
    const isContinent=rank==='KINGDOM'||rank==='DOMAIN';
    const isWildRank=isContinent||rank==='PHYLUM'||rank==='CLASS'||isOrder;

    if(!isWildRank){
      const base=cell.map((p,i)=>{
        const a=Math.atan2(p.y-c.y,p.x-c.x);
        const f=Math.max(.70,Math.min(.985,
          angularStyle(t,a)+.010*(h2(t.id,18000+i)-.5)
        ));
        return {p,f};
      });
      const targetArea=absArea(cell)*target;
      let lo=.70,hi=1.22,best=cell;
      for(let k=0;k<36;k++){
        const m=(lo+hi)/2;
        const q=base.map(o=>{
          const f=Math.min(.995,o.f*m);
          return{x:c.x+(o.p.x-c.x)*f,y:c.y+(o.p.y-c.y)*f};
        });
        best=q;
        if(absArea(q)<targetArea)lo=m;else hi=m;
      }
      return cleanPoly(best);
    }

    const detail=isOrder?96:72;
    const rotation=['animalia','plantae','fungi','bacteria','passeriformes','lepidoptera','odonata','diptera']
      .includes(String(t.canonicalName||'').toLowerCase())
      ? 0
      : 2*Math.PI*h2(t.id,17900);

    /* Sampling the complete radial boundary is the essential v24 change.
       Formerly only the 4–8 corners of a partition cell were styled, so a
       butterfly profile still rendered as a rounded rectangle. */
    const base=[];
    for(let i=0;i<detail;i++){
      const a=2*Math.PI*i/detail;
      const boundary=rayToCellRadius(cell,c,a);
      const localA=Math.atan2(Math.sin(a-rotation),Math.cos(a-rotation));
      const minF=isOrder?.25:(isContinent?.44:.38);
      const f=Math.max(minF,Math.min(.995,
        angularStyle(t,localA)+.007*(h2(t.id,18000+i)-.5)
      ));
      base.push({a,boundary,f});
    }

    const targetArea=absArea(cell)*target;
    const makePoly=m=>base.map(o=>{
      const f=Math.min(.998,o.f*m);
      return{
        x:c.x+Math.cos(o.a)*o.boundary*f,
        y:c.y+Math.sin(o.a)*o.boundary*f

    });

    /* If an unusually narrow cell cannot contain 85% with the full-depth
       profile, soften only as much as needed. The wild silhouette survives,
       but the quantitative area promise always wins. */
    for(let repair=0;repair<8&&absArea(makePoly(1.55))<targetArea;repair++){
      for(const o of base)o.f=1-(1-o.f)*.86;
    }

       cell. In that exceptional case a radial silhouette cannot reach the
       promised area. Preserve the inherited wild coastline and contract the
       complete cell homothetically, which gives the exact target area. */
    if(absArea(makePoly(1.55))<targetArea*.995){
      const contraction=Math.sqrt(target);
      return cleanPoly(cell.map(p=>({
        x:c.x+(p.x-c.x)*contraction,

      })));

    for(let k=0;k<38;k++){

    const childCells=partitionCells(t.poly,cs,String(t.id),0,new Map());

    for(const c of cs){
      const cc=childCells.get(String(c.id));
      const childCoverage=coverageForRank(c);
      if(cc&&cc.length>=3)layoutSubtree(c,cc,childCoverage);
    }

    if(r==='ORDER')return .50;

    let cell=rootCells.get(String(t.id));
    if(!cell){

      const b=polyBBox(worldPoly);
      const s=110+70*h2(t.id,19000);
      const cx=b.x+b.w*(.2+.6*h2(t.id,19001));
      const cy=b.y+b.h*(.2+.6*h2(t.id,19002));

  const spreadTargets={

    Chromista:{x:2220,y:1160},Protozoa:{x:1060,y:1380},

  const placed=[];

    candidates.sort((a,b)=>(a.x-target.x)**2+(a.y-target.y)**2-((b.x-target.x)**2+(b.y-target.y)**2));

      const candidate=clearancePoly(t.poly.map(p=>({x:p.x+dx,y:p.y+dy})));
      const box=polyBBox(candidate);
      if(box.x<18||box.y<18||box.x+box.w>2382||box.y+box.h>1482)continue;
      if([...majorPolys,...placed].some(p=>polygonsOverlap(candidate,p)))continue;

  /* ---------- bottom-up rebuild ABOVE order ----------

     Rebuild the parent outline to that exact child/parent relationship,

  function convexClip(subject,clip){

    for(let i=0;i<clip.length;i++){
      const A=clip[i],B=clip[(i+1)%clip.length];

      hi.push(p);

    return lo.concat(hi);

  function rebuildParentFromChildren(t){

      .filter(c=>c.poly&&c.poly.length>=3);
    if(!cs.length||!t.cellPoly)return;

    const cloud=[];
    for(const c of cs)for(const p of c.poly)cloud.push(p);
    if(cloud.length<3)return;

    let env=hull(cloud);
    if(env.length<3)return;

    const childArea=cs.reduce((s,c)=>s+absArea(c.poly),0);
    const childRank=(cs[0]?.rank||'').toUpperCase();
    const desiredChildCoverage=childRank==='ORDER' ? .50 : .85;
    const targetArea=childArea/desiredChildCoverage;
    const ctr=polygonCentroid(env);

    /* Expand the child hull toward the exact 85% coverage target. */
    let lo=1,hi=2,best=env;
    for(let k=0;k<30;k++){
      const m=(lo+hi)/2;

        x:ctr.x+(p.x-ctr.x)*m,

  /* ---------- diagnostics ---------- */
  function trueWorldLandFraction(){
    const rootsNow=top.filter(t=>t.poly&&t.poly.length>=3);
    return rootsNow.reduce((s,t)=>s+absArea(t.poly),0)/absArea(worldPoly);
  }

  payload.meta=payload.meta||{};
  payload.meta.worldLandFraction=trueWorldLandFraction();

  /* Recompute local coverage using the new geometry. */
  computeRecursiveCoverage();

  let orderCount=0;
  for(const t of taxa)if((t.rank||'').toUpperCase()==='ORDER'&&t.poly)orderCount++;
  payload.meta.orderFirstCount=orderCount;
})();

function pathFromPoly(poly){
  if(!poly||poly.length<3)return'';
  const mids=poly.map((p,i)=>{const q=poly[(i+1)%poly.length];return{x:(p.x+q.x)/2,y:(p.y+q.y)/2}});
  let d=`M${mids[mids.length-1].x},${mids[mids.length-1].y}`;
  for(let i=0;i<poly.length;i++)d+=` Q${poly[i].x},${poly[i].y} ${mids[i].x},${mids[i].y}`;
  return d+'Z'
}
function pathFromPolyExact(poly){
  if(!poly||poly.length<3)return'';
  let d=`M${poly[0].x},${poly[0].y}`;
  for(let i=1;i<poly.length;i++)d+=` L${poly[i].x},${poly[i].y}`;
  return d+'Z';
}
function displayPathForTaxon(t,poly){
  const r=detailRank(t);
  /* Never smooth FAMILY/GENUS/SPECIES across their mathematical cell edge.
     The curved midpoint path used for higher ranks can bulge outside a tiny
     cell and was the cause of the giant overlapping white species in v44. */
  if(r==='FAMILY'||r==='GENUS'||r==='SPECIES')return pathFromPolyExact(poly);
  return pathFromPoly(poly);
}
function refineContour(poly,factor=100,seed='coast'){
  if(!poly||poly.length<3||factor<=1)return poly;
  const out=[],n=poly.length;
  for(let i=0;i<n;i++){
    const p0=poly[(i-1+n)%n],p1=poly[i],p2=poly[(i+1)%n],p3=poly[(i+2)%n];
    for(let j=0;j<factor;j++){
      const u=j/factor,u2=u*u,u3=u2*u;
      out.push({
        x:.5*((2*p1.x)+(-p0.x+p2.x)*u+(2*p0.x-5*p1.x+4*p2.x-p3.x)*u2+(-p0.x+3*p1.x-3*p2.x+p3.x)*u3),
        y:.5*((2*p1.y)+(-p0.y+p2.y)*u+(2*p0.y-5*p1.y+4*p2.y-p3.y)*u2+(-p0.y+3*p1.y-3*p2.y+p3.y)*u3)
      });

     lengths create broad bays, smaller peninsulas and fine coastal detail. */

  const phases=[21001,21002,21003,21004].map(k=>2*Math.PI*h2(seed,k));
  const detailed=out.map((p,i)=>{
    const u=2*Math.PI*i/out.length;
    const coast=.044*Math.sin(7*u+phases[0])
      +.024*Math.sin(17*u+phases[1])
      +.012*Math.sin(37*u+phases[2])
      +.006*Math.sin(83*u+phases[3]);

}
function minZoom(t){
  const d=Math.max(0,t.depth||0);
  const rank=(t.rank||'').toUpperCase();
  const rankZ={DOMAIN:.72,KINGDOM:.72,PHYLUM:.80,CLASS:1.10,ORDER:1.70,FAMILY:3.0,GENUS:4.8,SPECIES:9.0};
  return Math.max(rankZ[rank]||.88,.70+d*.31);

function contourFactorFor(t){
  const rank=(t.rank||'').toUpperCase();
  if(rank==='DOMAIN'||rank==='KINGDOM')return 100;
  if(rank==='PHYLUM')return 28;
  if(rank==='CLASS')return 16;
  if(rank==='ORDER')return 10;
  return 1;
}

function isPersonalSpecies(t){
  return detailRank(t)==='SPECIES'&&(
    personalSpeciesIds.has(String(t.id))||(personalRankNameCounts.get(personalNameKey(t))||0)>0
  );
}
function displayFill(t){
  const id=String(t.id),rank=detailRank(t);
  if(isPersonalSpecies(t))return'#087fd1';
  const seen=personalSeenCounts.get(id)||personalRankNameCounts.get(personalNameKey(t))||0;
  if(personalMode&&seen>0){
    const strength=.30+.60*Math.sqrt(seen/Math.max(1,personalMaxSeen));
    return mixHex(fillFor(t),'#087fd1',Math.min(.90,strength));
  }

}
function speciesLabelClass(t){
  if(isPersonalSpecies(t))return'label speciesLabelObserved';

function renderTaxon(t){
  if(!t||t.id==='__life'||!t.poly||t.poly.length<3)return;
  const sid=String(t.id);

  t.box=polyBBox(t.poly);
  t.center=polygonCentroid(t.poly);
  t.area=absArea(t.poly);

  const drawnPoly=refineContour(t.poly,contourFactorFor(t),t.id);
  const d=displayPathForTaxon(t,drawnPoly);

  /* v45: geometry is allowed to change after lazy descendants arrive.
     Update an existing SVG node instead of returning with stale geometry. */
  const existing=renderedById.get(sid);
  if(existing){
    existing.p.setAttribute('d',d);
    existing.p.setAttribute('fill',displayFill(t));
    existing.text.setAttribute('x',t.center.x);
    existing.text.setAttribute('y',t.center.y);
    existing.text.textContent=t.vernacularName||t.canonicalName;
    if(detailRank(t)==='GENUS')updateGenusBoundary(t);
    return existing;
  }

  renderedIds.add(sid);

  if((t.depth||0)===0){
    const haloWide=document.createElementNS(NS,'path');
    haloWide.setAttribute('d',pathFromPoly(drawnPoly));
    haloWide.setAttribute('class','continentHaloWide');
    haloWide.setAttribute('stroke-width','40');
    hg.appendChild(haloWide);

    const haloNear=document.createElementNS(NS,'path');
    haloNear.setAttribute('d',pathFromPoly(drawnPoly));
    haloNear.setAttribute('class','continentHaloNear');
    haloNear.setAttribute('stroke-width','12');
    hg.appendChild(haloNear);
  }

  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',d);
  p.setAttribute('fill',displayFill(t));
  p.setAttribute('fill-opacity','.98');
  p.setAttribute('class',detailRank(t)==='SPECIES'?'taxonPath speciesDot':'taxonPath');

  {
    const rr=(t.rank||'').toUpperCase();
    if(['DOMAIN','KINGDOM','PHYLUM','CLASS','ORDER'].includes(rr))
      p.setAttribute('filter','url(#landTexture)');
  }

  if(detailRank(t)==='SPECIES'){
    p.setAttribute('stroke','#303030');
    p.setAttribute('stroke-opacity','1');
    p.setAttribute('stroke-width','.35');
  }else{
    p.setAttribute('stroke',edgeColorFor(t));
    p.setAttribute('stroke-opacity','.34');
    p.setAttribute('stroke-width','1.05');
  }

  {
    const rr=(t.rank||'').toUpperCase();
    const persistent=new Set(['DOMAIN','KINGDOM','PHYLUM','CLASS','ORDER']);
    p.dataset.minz=persistent.has(rr)?.52:minZoom(t);
  }

  p.dataset.id=sid;
  p.onclick=e=>{e.stopPropagation();focus(t)};
  rg.appendChild(p);

  const label=document.createElementNS(NS,'text');
  label.setAttribute('x',t.center.x);
  label.setAttribute('y',t.center.y);
  label.setAttribute('text-anchor','middle');
  label.setAttribute('class','label');
  if(detailRank(t)==='SPECIES')label.setAttribute('class',speciesLabelClass(t));
  const labelName=t.vernacularName||t.canonicalName||t.name||'';
  if(detailRank(t)==='SPECIES'){
    const parts=String(labelName).trim().split(/\s+/);
    if(parts.length>=2){
      const a=document.createElementNS(NS,'tspan');
      a.setAttribute('x',t.center.x); a.setAttribute('dy','-0.12em'); a.textContent=parts[0];
      const b=document.createElementNS(NS,'tspan');
      b.setAttribute('x',t.center.x); b.setAttribute('dy','1.08em'); b.textContent=parts.slice(1).join(' ');
      label.appendChild(a); label.appendChild(b);
    }else label.textContent=labelName;
  }else label.textContent=labelName;
  label.dataset.minz=(detailRank(t)==='SPECIES'?Math.max(18,minZoom(t)*1.6):(minZoom(t)*1.02));
  label.dataset.id=sid;
  lg.appendChild(label);

  const obj={t,p,text:label};
  elems.push(obj);
  renderedById.set(sid,obj);
  return obj;
}

/* =====================================================================
   v43 DEEP LAZY DETAIL ENGINE
   ---------------------------------------------------------------------
   Base map stays light: world -> ORDER is loaded from data/taxa.json.

   When an ORDER becomes relevant:
     data/orders/<order>.json loads FAMILY + GENUS.

   When a GENUS becomes relevant:
     data/families/<family>.json loads SPECIES for that family.

   Area rules:
     ORDER          = existing iNaturalist-derived weight
     FAMILY / GENUS = descendant speciesCount
     SPECIES        = fixed weight 1
   ===================================================================== */

const loadedOrders=new Set();
const loadedFamilies=new Set();
const detailPromises=new Map();
const searchShardCache=new Map();

function safeDetailId(id){
  return String(id).replace(/[^A-Za-z0-9._-]/g,'_');
}
function detailRank(t){
  return (t?.rank||'').toUpperCase();
}
function detailWeight(t){
  const r=detailRank(t);
  if(r==='FAMILY'||r==='GENUS')return Math.max(1,+t.speciesCount||1);
  if(r==='SPECIES')return 1;
  return Math.max(.0001,+t.weight||+t.mapWeight||1);
}

/* v49: hierarchical detail layout. FAMILY and GENUS are weighted only by
   descendant species counts. SPECIES all have weight 1. There is deliberately
   NO absolute world-area species constant: every level is allocated inside its
   existing parent polygon, preserving the established ORDER geometry. */
const DETAIL_LAND_FRACTION=.70;
/* v55: higher levels keep the recursive 70/30 allocation. Species retain weight 1,
   then receive equal compact geometry inside their allocation cells. */
const SPECIES_MATERIALISE_Z=6.0;
const SPECIES_FOCUS_Z=220;
const MAX_MANUAL_Z=800;
const generaWithVisibleSpecies=new Set();
const genusOverlayIds=new Set();
const genusOverlayById=new Map();

function updateGenusBoundary(genus){
  if(!genus?.poly||detailRank(genus)!=='GENUS')return;
  const id=String(genus.id);
  const p=genusOverlayById.get(id);
  if(p)p.setAttribute('d',pathFromPolyExact(genus.poly));
}
function ensureGenusBoundary(genus){
  if(!genus?.poly||detailRank(genus)!=='GENUS')return;
  const id=String(genus.id);
  const existing=genusOverlayById.get(id);
  if(existing){
    existing.setAttribute('d',pathFromPolyExact(genus.poly));
    return;
  }
  genusOverlayIds.add(id);

  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',pathFromPolyExact(genus.poly));
  p.setAttribute('class','genusBoundary');
  p.dataset.genus=id;
  og.appendChild(p);
  genusOverlayById.set(id,p);
}

function detailClipAxis(poly,axis,cut,keepLow){
  const value=p=>axis==='x'?p.x:p.y;
  const inside=p=>keepLow?value(p)<=cut+1e-8:value(p)>=cut-1e-8;
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length];
    const va=value(a),vb=value(b),ia=inside(a),ib=inside(b);
    if(ia)out.push({x:a.x,y:a.y});
    if(ia!==ib){
      const den=vb-va;
      const u=Math.abs(den)<1e-12?0:(cut-va)/den;
      out.push({x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u});
    }
  }
  return cleanPoly(out);
}
function detailCutForArea(poly,axis,fraction){
  const b=polyBBox(poly);
  let lo=axis==='x'?b.x:b.y,hi=axis==='x'?b.x+b.w:b.y+b.h;
  const target=absArea(poly)*fraction;
  for(let k=0;k<36;k++){
    const mid=(lo+hi)/2;
    const q=detailClipAxis(poly,axis,mid,true);
    const a=q.length>=3?absArea(q):0;
    if(a<target)lo=mid;else hi=mid;
  }
  return(lo+hi)/2;
}
function detailBalancedSplit(items){
  const sorted=[...items].sort((a,b)=>detailWeight(b)-detailWeight(a));
  const A=[],B=[];let wa=0,wb=0;
  for(const t of sorted){
    if(wa<=wb){A.push(t);wa+=detailWeight(t)}
    else{B.push(t);wb+=detailWeight(t)}
  }
  if(!A.length||!B.length){
    const m=Math.ceil(sorted.length/2);
    return[sorted.slice(0,m),sorted.slice(m)];
  }
  return[A,B];
}
function detailPartition(poly,items,seed,depth=0,out=new Map()){
  if(!items.length)return out;
  if(items.length===1){
    out.set(String(items[0].id),cleanPoly(poly));
    return out;
  }

  const[A,B]=detailBalancedSplit(items);
  const wa=A.reduce((s,t)=>s+detailWeight(t),0);
  const wb=B.reduce((s,t)=>s+detailWeight(t),0);
  const fraction=wa/(wa+wb);

  const box=polyBBox(poly);
  let axis;
  if(box.w>box.h*1.18)axis='x';
  else if(box.h>box.w*1.18)axis='y';
  else axis=h2(seed,depth*97+items.length)>.5?'x':'y';

  let cut=detailCutForArea(poly,axis,fraction);
  let pA=detailClipAxis(poly,axis,cut,true);
  let pB=detailClipAxis(poly,axis,cut,false);

  // Prefer compact weighted genus cells before shaping, without moving vertices.
  if(items.every(t=>detailRank(t)==='GENUS')){
    const quality=p=>{
      if(p.length<3)return Infinity;
      const b=polyBBox(p),a=absArea(p);
      let perimeter=0;
      for(let i=0;i<p.length;i++)perimeter+=Math.hypot(p[i].x-p[(i+1)%p.length].x,p[i].y-p[(i+1)%p.length].y);
      return perimeter*perimeter/Math.max(a,1e-12)+4*Math.max(b.w/b.h,b.h/b.w);
    };
    const other=axis==='x'?'y':'x',otherCut=detailCutForArea(poly,other,fraction);
    const qA=detailClipAxis(poly,other,otherCut,true),qB=detailClipAxis(poly,other,otherCut,false);
    if(Math.max(quality(qA),quality(qB))<Math.max(quality(pA),quality(pB))*.98){pA=qA;pB=qB;}
  }

  if(pA.length<3||pB.length<3){
    axis=axis==='x'?'y':'x';
    cut=detailCutForArea(poly,axis,fraction);
    pA=detailClipAxis(poly,axis,cut,true);
    pB=detailClipAxis(poly,axis,cut,false);
  }

  detailPartition(pA,A,seed+'L',depth+1,out);
  detailPartition(pB,B,seed+'R',depth+1,out);
  return out;
}

/* Shape a child inside its allocation cell at the requested visual coverage. */
function detailShapeFromCell(cell,t,coverage=DETAIL_LAND_FRACTION){
  if(!cell||cell.length<3)return cell;
  cell=detailUntanglePolygon(cell);
  const c=polygonCentroid(cell);
  const target=absArea(cell)*coverage;

  const rough=cell.map((p,i)=>{
    const a=Math.atan2(p.y-c.y,p.x-c.x);
    const f=.94
      +.022*Math.sin(3*a+6.28*h2(t.id,25000))
      +.014*Math.sin(7*a+6.28*h2(t.id,25100))
      +.010*(h2(t.id,25200+i)-.5);
    return{p,f:Math.max(.84,Math.min(.985,f))};
  });

  let lo=.75,hi=1.12,best=cell;
  for(let k=0;k<28;k++){
    const m=(lo+hi)/2;
    const q=rough.map(o=>{
      const f=Math.min(.995,o.f*m);
      return{x:c.x+(o.p.x-c.x)*f,y:c.y+(o.p.y-c.y)*f};
    });
    best=q;
    if(absArea(q)<target)lo=m;else hi=m;
  }
  const result=cleanPoly(best);
  if(detailRank(t)==='GENUS'){
    let perimeter=0;
    for(let i=0;i<result.length;i++)perimeter+=Math.hypot(result[i].x-result[(i+1)%result.length].x,result[i].y-result[(i+1)%result.length].y);
    const irregularity=perimeter*perimeter/(4*Math.PI*Math.max(1e-12,absArea(result)));
    if(!detailSimplePolygon(result)||irregularity>2.4)return detailSafeGenusCore(cell,t);
  }
  return result;
}


/* v55: species use compact equal-radius geometry inside equal-weight allocation cells. */

function detailSimplePolygon(poly){
  const cross=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
  for(let i=0;i<poly.length;i++)for(let j=i+2;j<poly.length;j++){
    if(i===0&&j===poly.length-1)continue;
    const a=poly[i],b=poly[(i+1)%poly.length],c=poly[j],d=poly[(j+1)%poly.length];
    if(cross(a,b,c)*cross(a,b,d)<0&&cross(c,d,a)*cross(c,d,b)<0)return false;
  }
  return poly.length>=3&&absArea(poly)>0;
}

// A clipped concave ancestor can already contain crossed edges. Uncross
// them by reversing the intervening boundary chain (2-opt), never by
// pulling vertices towards a centroid outside the polygon.
function detailUntanglePolygon(poly){
  const p=poly.map(q=>({x:q.x,y:q.y}));
  const cross=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
  for(let pass=0;pass<p.length*p.length;pass++){
    let changed=false;
    outer:for(let i=0;i<p.length;i++)for(let j=i+2;j<p.length;j++){
      if(i===0&&j===p.length-1)continue;
      const a=p[i],b=p[(i+1)%p.length],c=p[j],d=p[(j+1)%p.length];
      if(cross(a,b,c)*cross(a,b,d)<0&&cross(c,d,a)*cross(c,d,b)<0){
        const reversed=p.slice(i+1,j+1).reverse();
        p.splice(i+1,j-i,...reversed);changed=true;break outer;
      }
    }
    if(!changed)return p;
  }
  throw new Error('Ongeldige taxoncontour');
}

// Exact boundary clearance, including concave bays; no sampled circle perimeter.
function detailClearance(p,poly){
  if(!pointInPoly(p,poly))return 0;
  let d=Infinity;
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length],dx=b.x-a.x,dy=b.y-a.y;
    const u=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));
    d=Math.min(d,Math.hypot(p.x-a.x-u*dx,p.y-a.y-u*dy));
  }
  return d;
}
// Only pathological silhouettes use a compact core. Every point of this
// gently lobed contour lies inside a verified inscribed circle.
function detailLargestInscribedCircle(poly){
  const b=polyBBox(poly);
  let best={x:b.x+b.w/2,y:b.y+b.h/2},radius=detailClearance(best,poly);
  let region={...b};
  for(let pass=0;pass<4;pass++){
    for(let iy=0;iy<=20;iy++)for(let ix=0;ix<=20;ix++){
      const p={x:region.x+region.w*ix/20,y:region.y+region.h*iy/20};
      const r=detailClearance(p,poly);
      if(r>radius){radius=r;best=p;}
    }
    region={x:best.x-region.w/10,y:best.y-region.h/10,w:region.w/5,h:region.h/5};
  }
  if(!(radius>0))throw new Error('Geen veilige genuskern');
  return{center:best,radius};
}
function detailSafeGenusCore(poly,t){
  const safe=detailLargestInscribedCircle(poly),best=safe.center,radius=safe.radius;
  const phase=h2(t.id,63000)*Math.PI*2;
  return Array.from({length:40},(_,i)=>{
    const a=i*Math.PI*2/40,r=radius*(.94+.025*Math.sin(3*a+phase));
    return{x:best.x+Math.cos(a)*r,y:best.y+Math.sin(a)*r};
  });
}
function detailPackSpecies(poly,count,wanted){
  const safe=detailLargestInscribedCircle(poly);
  function attempt(r){
    const points=[{...safe.center}],pitch=4.55*r,spiral=pitch/(2*Math.PI),step=2.08*r;
    let theta=0;
    for(let i=1;i<count;i++){
      const prev=points[points.length-1];
      const at=a=>({x:safe.center.x+spiral*a*Math.cos(a),y:safe.center.y+spiral*a*Math.sin(a)});
      let lo=theta,hi=theta+Math.max(.12,step/Math.max(spiral,spiral*theta));
      while(Math.hypot(at(hi).x-prev.x,at(hi).y-prev.y)<step)hi+=(hi-theta||.2);
      for(let k=0;k<24;k++){
        const mid=(lo+hi)/2,p=at(mid);
        if(Math.hypot(p.x-prev.x,p.y-prev.y)<step)lo=mid;else hi=mid;
      }
      theta=(lo+hi)/2;
      const p=at(theta);
      if(detailClearance(p,poly)<r*1.015)return null;
      points.push(p);
    }
    /* Adjacent beads almost touch; every other pair needs visible air. */
    for(let i=0;i<points.length;i++)for(let j=i+2;j<points.length;j++)
      if(Math.hypot(points[i].x-points[j].x,points[i].y-points[j].y)<r*2.65)return null;
    return points;
  }
  let r=Math.min(wanted,safe.radius/Math.sqrt(Math.max(1,count)*3.2));
  for(let k=0;k<100;k++,r*=.94){
    const points=attempt(r);
    if(points)return{points,r};
  }
  throw new Error('Geen geldige soortenplaatsing gevonden');
}

function addLazyTaxon(raw){
  if(!raw||raw.id==null)return byId.get(String(raw?.id));
  const id=String(raw.id);
  const existing=byId.get(id);
  if(existing){
    Object.assign(existing,raw);
    return existing;
  }

  const t={...raw,id};
  const parent=byId.get(String(t.parentId));
  t.depth=Number.isFinite(+t.depth)?+t.depth:((parent?.depth??0)+1);
  taxa.push(t);
  byId.set(id,t);

  const pid=String(t.parentId);
  if(!children.has(pid))children.set(pid,[]);
  children.get(pid).push(t);
  return t;
}

function layoutLazyChildren(parent){
  if(!parent?.poly)return;
  let cs=(children.get(String(parent.id))||[])
    .filter(c=>['FAMILY','GENUS','SPECIES'].includes(detailRank(c)));
  /* v59: once a family species shard is loaded, do not allocate/render a
     genus for which that shard contains no species. This prevents empty genus
     boxes caused by incomplete/mismatched detail rows. */
  if(detailRank(parent)==='FAMILY' && loadedFamilies.has(String(parent.id))){
    cs=cs.filter(c=>detailRank(c)!=='GENUS' ||
      (children.get(String(c.id))||[]).some(x=>detailRank(x)==='SPECIES'));
  }
  if(!cs.length)return;

  /* v57: FAMILY and GENUS keep the proven weighted recursive partition.
     SPECIES still have weight 1, but their visible area is now normalised at
     ORDER level instead of GENUS level. Therefore every species belonging to
     the same order has exactly the same visible area. Three 70% land steps
     (order->family->genus->species) determine the species-area budget. */
  const cells=detailPartition(parent.poly,cs,String(parent.id),0,new Map());
  const speciesLevel=detailRank(parent)==='GENUS' && cs.every(c=>detailRank(c)==='SPECIES');
  let commonSpeciesRadius=null;
  if(speciesLevel){
    let order=parent;
    while(order && detailRank(order)!=='ORDER') order=byId.get(String(order.parentId));
    const n=Math.max(1,+order?.speciesCount||1);
    const orderArea=Math.max(1e-9,order?.area||absArea(order?.poly||[]));
    const targetSpeciesArea=orderArea*Math.pow(DETAIL_LAND_FRACTION,3)/n;
    /* v58: keep the order-wide equality from v57, but reserve a real gap
       between neighbouring species. The same factor is applied to every
       species in the order, so equal area remains guaranteed. */
    const SPECIES_RADIUS_GAP_FACTOR=.88;
    commonSpeciesRadius=Math.sqrt(targetSpeciesArea/Math.PI)*SPECIES_RADIUS_GAP_FACTOR;
  }

  /* v63: a hexagonal lattice gives separated centres. Exact segment distance
     guarantees each complete circle fits; locally reduce the common radius
     if the order-wide requested size cannot fit this genus. */
  let relaxedSpecies=null;
  if(speciesLevel && commonSpeciesRadius){
    const packed=detailPackSpecies(parent.poly,cs.length,commonSpeciesRadius);
    parent.speciesRadiusScale=packed.r/commonSpeciesRadius;
    commonSpeciesRadius=packed.r;
    relaxedSpecies=cs.map((c,i)=>{c.speciesChainIndex=i;return{t:c,...packed.points[i]}});
  }

  for(const c of cs){
    const cell=cells.get(String(c.id));
    if(!cell||cell.length<3)continue;

    c.cellPoly=cell;
    const childRank=detailRank(c);
    if(speciesLevel&&childRank==='SPECIES'){
      const packed=relaxedSpecies?.find(q=>String(q.t.id)===String(c.id));
      const ctr=packed?{x:packed.x,y:packed.y}:polygonCentroid(cell),r=commonSpeciesRadius||0;
      const pts=[];
      for(let j=0;j<28;j++){
        const a=2*Math.PI*j/28;
        pts.push({x:ctr.x+Math.cos(a)*r,y:ctr.y+Math.sin(a)*r});
      }
      c.poly=cleanPoly(pts);
    }else{
      c.poly=detailShapeFromCell(cell,c,DETAIL_LAND_FRACTION);
    }
    c.box=polyBBox(c.poly);
    c.center=polygonCentroid(c.poly);
    c.area=absArea(c.poly);

    if(childRank==='SPECIES'){
      const gid=String(c.parentId);
      c.equalSpeciesCellArea=absArea(cell);
      c.equalSpeciesArea=c.area;
      if(!deferredSpeciesByGenus.has(gid))deferredSpeciesByGenus.set(gid,[]);
      if(!deferredSpeciesIds.has(String(c.id))){
        deferredSpeciesIds.add(String(c.id));
        deferredSpeciesByGenus.get(gid).push(c);
      }
      ensureGenusBoundary(parent);
    }else{
      renderTaxon(c);
      layoutLazyChildren(c);
    }
  }

  parent.childLandFraction=Math.min(
    1,
    cs.reduce((sum,c)=>sum+(c.poly?absArea(c.poly):0),0) /
      Math.max(1e-9,absArea(parent.poly))
  );
}

function mergeSearchRows(newTaxa){
  for(const t of newTaxa){
    const c=norm(t.canonicalName),v=norm(t.vernacularName);
    if(c&&!searchExact.has(c))searchExact.set(c,t);
    if(v&&!searchExact.has(v))searchExact.set(v,t);
    searchRows.push({t,c,v});
  }
}

async function ensureOrderDetails(orderOrId){
  const order=typeof orderOrId==='object'
    ? orderOrId
    : byId.get(String(orderOrId));
  if(!order||detailRank(order)!=='ORDER')return null;

  const id=String(order.id);
  if(loadedOrders.has(id))return order;

  const key='order:'+id;
  if(detailPromises.has(key))return detailPromises.get(key);

  const promise=(async()=>{
    try{
      const url=`data/orders/${safeDetailId(id)}.json`;
      const r=await fetch(url,{cache:'force-cache'});
      if(!r.ok){
        if(r.status!==404)console.warn('Order detail load failed',url,r.status);
        return order;
      }
      const payload=await r.json();
      const added=[];
      for(const raw of payload.taxa||[]){
        const before=byId.has(String(raw.id));
        const t=addLazyTaxon(raw);
        if(t&&!before)added.push(t);
      }
      loadedOrders.add(id);
      layoutLazyChildren(order);
      mergeSearchRows(added);
      lastSemantic=-1;
      semantic(2400/view.w,true);
      return order;
    }catch(err){
      console.warn('Order detail error',id,err);
      return order;
    }finally{
      detailPromises.delete(key);
    }
  })();

  detailPromises.set(key,promise);
  return promise;
}

async function ensureFamilySpecies(familyOrId){
  const family=typeof familyOrId==='object'
    ? familyOrId
    : byId.get(String(familyOrId));
  if(!family||detailRank(family)!=='FAMILY')return null;

  const id=String(family.id);
  if(loadedFamilies.has(id))return family;

  const key='family:'+id;
  if(detailPromises.has(key))return detailPromises.get(key);

  const promise=(async()=>{
    try{
      const url=`data/families/${safeDetailId(id)}.json`;
      const r=await fetch(url,{cache:'force-cache'});
      if(!r.ok){
        if(r.status!==404)console.warn('Family species load failed',url,r.status);
        return family;
      }
      const payload=await r.json();
      const added=[];
      for(const raw of payload.taxa||[]){
        const before=byId.has(String(raw.id));
        const t=addLazyTaxon(raw);
        if(t&&!before)added.push(t);
      }

      /* v59 generic parent repair. Some detail rows can carry a stale/missing
         genus parent id. A binomial species name already states its genus, so
         reconnect such rows to the matching genus in this family. */
      const familyGenera=(children.get(id)||[]).filter(t=>detailRank(t)==='GENUS');
      const genusByName=new Map(familyGenera.map(g=>[norm(g.name||g.canonicalName||''),g]));
      for(const sp of added.filter(t=>detailRank(t)==='SPECIES')){
        const bin=String(sp.name||sp.canonicalName||'').trim().split(/\s+/);
        const g=genusByName.get(norm(bin[0]||''));
        if(!g)continue;
        const oldPid=String(sp.parentId);
        if(oldPid!==String(g.id)){
          const oldKids=children.get(oldPid)||[];
          const ix=oldKids.indexOf(sp); if(ix>=0)oldKids.splice(ix,1);
          sp.parentId=String(g.id);
          if(!children.has(String(g.id)))children.set(String(g.id),[]);
          if(!children.get(String(g.id)).includes(sp))children.get(String(g.id)).push(sp);
        }
      }

      /* v61: a genus must never be visually empty. If the family shard has no
         species row for a genus, add exactly one neutral placeholder species.
         The existing two-line species label renderer shows this as:
             Genus
             ?
         This replaces the old one-off Yarquen repair and works for every genus. */
      for(const genus of (children.get(id)||[]).filter(t=>detailRank(t)==='GENUS')){
        const hasSpecies=(children.get(String(genus.id))||[])
          .some(t=>detailRank(t)==='SPECIES');
        if(hasSpecies)continue;
        const genusName=String(genus.name||genus.canonicalName||'Genus').trim()||'Genus';
        const placeholder=addLazyTaxon({
          id:`atlas:species:placeholder:${genus.id}`,
          parentId:String(genus.id),
          name:`${genusName} ?`,
          canonicalName:`${genusName} ?`,
          rank:'SPECIES',
          speciesCount:1,
          syntheticPlaceholder:true
        });
        if(placeholder)added.push(placeholder);
      }
      loadedFamilies.add(id);

      /* v45: FIRST give every genus its definitive position/shape inside
         the family. Only THEN partition each definitive genus into species.
         v44 did this in the opposite order first, leaving stale oversized
         species geometry around during lazy relayout. */
      layoutLazyChildren(family);

      const genera=(children.get(id)||[]).filter(t=>detailRank(t)==='GENUS');
      for(const g of genera){
        /* layoutLazyChildren(family) already recurses, but this explicit pass
           guarantees species geometry uses the final genus polygon and also
           refreshes any SVG node that was previously materialised. */
        layoutLazyChildren(g);
        renderTaxon(g);
        ensureGenusBoundary(g);

        for(const s of (children.get(String(g.id))||[])){
          if(detailRank(s)==='SPECIES'&&renderedIds.has(String(s.id)))
            renderTaxon(s);
        }
      }

      mergeSearchRows(added);
      const z=2400/view.w;
      materialiseVisibleSpecies(z);
      lastSemantic=-1;
      semantic(z,true);
      return family;
    }catch(err){
      console.warn('Family species error',id,err);
      return family;
    }finally{
      detailPromises.delete(key);
    }
  })();

  detailPromises.set(key,promise);
  return promise;
}

async function ensureGenusSpecies(genusOrId){
  const genus=typeof genusOrId==='object'
    ? genusOrId
    : byId.get(String(genusOrId));
  if(!genus||detailRank(genus)!=='GENUS')return null;
  const family=byId.get(String(genus.parentId));
  if(family&&detailRank(family)==='FAMILY')
    await ensureFamilySpecies(family);
  return genus;
}


function materialiseSpeciesForGenus(genus,z,forceOne=null){
  if(!genus)return 0;
  const gid=String(genus.id);
  const list=deferredSpeciesByGenus.get(gid)||[];
  if(!list.length)return 0;

  const sw=(genus.box?.w||0)*z;
  const sh=(genus.box?.h||0)*z;

  /* Only build species SVG nodes when a genus is genuinely explorable.
     A searched species can force just itself to materialise immediately. */
  if(!forceOne && z<SPECIES_MATERIALISE_Z)return 0;

  let made=0;
  for(const s of list){
    if(forceOne && String(s.id)!==String(forceOne.id))continue;
    if(renderedIds.has(String(s.id)))continue;

    if(forceOne || intersectsView(s.box,view,.24)){
      renderTaxon(s);
      made++;
    }
  }
  if(made){
    generaWithVisibleSpecies.add(gid);
    ensureGenusBoundary(genus);
  }
  return made;
}

function materialiseVisibleSpecies(z){
  if(z<SPECIES_MATERIALISE_Z)return 0;
  let made=0;

  /* Iterate visible rendered genera only, never the complete species pool. */
  for(const o of elems){
    if(detailRank(o.t)!=='GENUS')continue;
    if(o.p.style.display==='none')continue;
    made+=materialiseSpeciesForGenus(o.t,z);
  }

  if(made){
    lastSemantic=-1;
  }
  return made;
}

/* Load details automatically only when the screen area is large enough.
   This preserves the v40/v41 performance improvements. */
let detailAutoLoadBusy=false;
async function maybeLoadVisibleDetails(z){
  if(detailAutoLoadBusy)return;

  let candidate=null;
  let candidateScore=0;

  for(const o of elems){
    if(o.p.style.display==='none')continue;
    const r=detailRank(o.t);
    const sw=(o.t.box?.w||0)*z;
    const sh=(o.t.box?.h||0)*z;
    const score=sw*sh;

    if(r==='ORDER'&&!loadedOrders.has(String(o.t.id))&&z>=2.5&&sw>320){
      if(score>candidateScore){candidate={kind:'order',t:o.t};candidateScore=score}
    }else if(r==='FAMILY'&&!loadedFamilies.has(String(o.t.id))&&z>=5.8&&sw>380){
      if(score>candidateScore){candidate={kind:'family',t:o.t};candidateScore=score}
    }else if(r==='GENUS'&&z>=6.8&&sw>300){
      const fam=byId.get(String(o.t.parentId));
      if(fam&&detailRank(fam)==='FAMILY'&&!loadedFamilies.has(String(fam.id))){
        if(score>candidateScore){candidate={kind:'family',t:fam};candidateScore=score}
      }
    }
  }

  if(!candidate)return;
  detailAutoLoadBusy=true;
  try{
    if(candidate.kind==='order')await ensureOrderDetails(candidate.t);
    else await ensureFamilySpecies(candidate.t);
  }finally{
    detailAutoLoadBusy=false;
  }
}

function detailSearchPrefix(q){
  const s=norm(q).replace(/[^a-z0-9]/g,'');
  return((s[0]||'_')+(s[1]||'_'));
}
async function findLazyTaxon(q){
  q=norm(q);
  if(!q)return null;
  const prefix=detailSearchPrefix(q);

  let rows=searchShardCache.get(prefix);
  if(rows===undefined){
    try{
      const r=await fetch(`data/search/${prefix}.json`,{cache:'force-cache'});
      rows=r.ok?await r.json():[];
    }catch(_){rows=[]}
    searchShardCache.set(prefix,rows);
  }

  let hit=rows.find(x=>x.n===q);
  if(!hit)hit=rows.find(x=>x.n?.startsWith(q));
  if(!hit)hit=rows.find(x=>x.n?.includes(q));
  if(!hit)return null;

  await ensureOrderDetails(hit.o);

  if(hit.r==='SPECIES'&&hit.f)
    await ensureFamilySpecies(hit.f);

  const taxon=byId.get(String(hit.id))||null;
  if(taxon&&detailRank(taxon)==='SPECIES'){
    const genus=byId.get(String(taxon.parentId));
    if(genus)materialiseSpeciesForGenus(genus,Math.max(8,2400/view.w),taxon);
    renderTaxon(taxon);
  }
  return taxon;
}

/* v69: MijnBiodiversiteit already knows the taxonomic lineage of every
   observed species. Use those names directly instead of downloading and
   parsing the 253 MB Atlas search index on the visitor's device. */
function refreshPersonalColors(){
  for(const o of elems){
    o.p.setAttribute('fill',displayFill(o.t));
    if(detailRank(o.t)==='SPECIES')o.text.setAttribute('class',speciesLabelClass(o.t));
  }
}
function publishPersonalResult(type,matched,total){
  const label=`${matched} van ${total} waargenomen soorten verwerkt`;
  personalLegend.style.display='block';
  personalLegend.querySelector('span:last-child').textContent=label;
  window.parent.postMessage({type,matched,total},'*');
}
function applyPersonalTaxonomy(rawRecords){
  const records=Array.isArray(rawRecords)?rawRecords:[];
  personalSeenCounts.clear();personalSpeciesIds.clear();personalRankNameCounts.clear();
  personalMode=true;
  const ranks=['KINGDOM','PHYLUM','CLASS','ORDER','FAMILY','GENUS','SPECIES'];
  let processed=0;
  for(const record of records){
    const species=norm(record?.SPECIES).trim();
    if(!species)continue;
    processed++;
    for(const rank of ranks){
      const name=norm(record?.[rank]).trim();
      if(!name)continue;
      const key=`${rank}|${name}`;
      personalRankNameCounts.set(key,(personalRankNameCounts.get(key)||0)+1);
    }
  }
  personalMaxSeen=Math.max(1,processed);
  refreshPersonalColors();
  publishPersonalResult('atlas-observations-applied',processed,records.length);
  return Promise.resolve({matched:processed,total:records.length});
}
window.addEventListener('message',event=>{
  if(event.data?.type==='atlas-observations')applyPersonalTaxonomy(event.data.taxonomyRecords);
});
window.parent.postMessage({type:'atlas-ready'},'*');

/* v40: normalize names once instead of repeatedly normalizing ~2,000 taxa
   on every search. */
const searchExact=new Map();
const searchRows=[];
for(const t of taxa){
  const c=norm(t.canonicalName),v=norm(t.vernacularName);
  if(c&&!searchExact.has(c))searchExact.set(c,t);
  if(v&&!searchExact.has(v))searchExact.set(v,t);
  searchRows.push({t,c,v});
}
function findTaxon(q){
  q=norm(q);
  if(!q)return null;
  const exact=searchExact.get(q);
  if(exact)return exact;
  for(const row of searchRows){
    if(row.c.includes(q)||row.v.includes(q))return row.t;
  }
  return null;
}
document.getElementById('search').onkeydown=async e=>{
  if(e.key!=='Enter')return;
  const input=e.target;
  const q=input.value;

  let hit=findTaxon(q);
  if(!hit){
    input.dataset.loading='1';
    const oldPlaceholder=input.placeholder;
    input.placeholder='Taxon laden…';
    hit=await findLazyTaxon(q);
    input.placeholder=oldPlaceholder;
    delete input.dataset.loading;
  }
  if(hit)focus(hit,true);
};

/* v40: only keep paths near the current viewport in the SVG render tree.
   display:none is important here: opacity:0 still leaves complex filtered
   paths expensive for Safari to composite. */
function intersectsView(box,r,margin=.16){
  if(!box)return true;
  const mx=r.w*margin,my=r.h*margin;
  return box.x+box.w>=r.x-mx && box.x<=r.x+r.w+mx &&
         box.y+box.h>=r.y-my && box.y<=r.y+r.h+my;
}

/* Paths through ORDER remain geographic context. Labels still phase in
   semantically, while offscreen geometry is culled for performance. */
function semantic(z,force=false){
  if(!force&&Math.abs(z-lastSemantic)<.08)return;
  lastSemantic=z;
  let deepest=0;
  for(const o of elems){
    const zoomVisible=z>=+o.p.dataset.minz;
    const onScreen=intersectsView(o.t.box,view);
    const visible=zoomVisible&&onScreen;

    o.p.style.display=visible?'':'none';
    o.p.classList.toggle('hidden',!visible);
    if(visible)deepest=Math.max(deepest,o.t.depth||0);

    const screenW=(o.t.box?.w||0)*z,screenH=(o.t.box?.h||0)*z;
    const rr=detailRank(o.t);
    const minW=rr==='SPECIES'?24:(rr==='GENUS'?72:62);
    const minH=rr==='SPECIES'?20:(rr==='GENUS'?30:26);
    /* v57: one semantic rule for every rank. Labels have no white backing or
       halo, species names appear once their species is large enough on screen,
       and lower-rank labels disappear again automatically while zooming out. */
    const labelVisible=visible && z>=+o.text.dataset.minz && screenW>minW && screenH>minH;
    o.text.style.display=labelVisible?'':'none';
    o.text.classList.toggle('hidden',!labelVisible);

    if(labelVisible){
      let fs=Math.max(8,Math.min(22,8.5+Math.sqrt(Math.max(20,Math.min(screenW,screenH)*2))/4.4));
      if((o.t.depth||0)===0)fs=Math.max(fs,29);
      else if((o.t.depth||0)===1)fs=Math.max(fs,19);
      o.text.setAttribute('font-size',fs/z);
    }
  }
  if(!crumbs.children.length){
    const names=['rijk/domein','stam','klasse','orde','familie','genus','soort'];
    levelEl.textContent=names[Math.min(names.length-1,Math.max(0,deepest))]||'wereld'
  }

  /* Never block the render loop on network I/O. */
  if(!personalMode&&z>=2.5)queueMicrotask(()=>maybeLoadVisibleDetails(z));
  if(!personalMode&&z>=SPECIES_MATERIALISE_Z)queueMicrotask(()=>{
    const made=materialiseVisibleSpecies(z);
    if(made)requestAnimationFrame(()=>semantic(z,true));
  });
}

/* v41 manual-navigation fast path */
let interactionActive=false,interactionTimer=null,lastFastCull=0;

function beginInteraction(){
  interactionActive=true;
  svg.classList.add('fastInteraction');
  if(interactionTimer){clearTimeout(interactionTimer);interactionTimer=null}
}
function finishInteractionSoon(delay=85){
  if(interactionTimer)clearTimeout(interactionTimer);
  interactionTimer=setTimeout(()=>{
    interactionActive=false;
    svg.classList.remove('fastInteraction');
    lastSemantic=-1;
    semantic(2400/view.w,true);
  },delay);
}
function directTargetToView(){
  view.x=target.x;view.y=target.y;view.w=target.w;view.h=target.h;
}

svg.addEventListener('wheel',e=>{
  e.preventDefault();
  beginInteraction();

  const r=svg.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
  const wx=target.x+px*target.w,wy=target.y+py*target.h;
  const f=Math.exp(e.deltaY*.0012);

  target.w=Math.max(2400/MAX_MANUAL_Z,Math.min(3000,target.w*f));
  target.h=Math.max(1500/MAX_MANUAL_Z,Math.min(1900,target.h*f));
  target.x=wx-px*target.w;target.y=wy-py*target.h;

  directTargetToView();
  finishInteractionSoon(95);
},{passive:false});

svg.onpointerdown=e=>{
  svg.setPointerCapture?.(e.pointerId);
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  beginInteraction();

  if(ptr.size===1){
    drag=true;
    last={x:e.clientX,y:e.clientY}
  }
  if(ptr.size===2){
    const p=[...ptr.values()];
    pinch={
      d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),
      v:{...target},
      cx:(p[0].x+p[1].x)/2,
      cy:(p[0].y+p[1].y)/2
    };
    drag=false
  }
};

svg.onpointermove=e=>{
  if(!ptr.has(e.pointerId))return;
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(ptr.size===2&&pinch){
    const p=[...ptr.values()];
    const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    const sc=pinch.d/d,r=svg.getBoundingClientRect();
    const px=(pinch.cx-r.left)/r.width,py=(pinch.cy-r.top)/r.height;
    const wx=pinch.v.x+px*pinch.v.w,wy=pinch.v.y+py*pinch.v.h;

    target.w=Math.max(2400/MAX_MANUAL_Z,Math.min(3000,pinch.v.w*sc));
    target.h=Math.max(1500/MAX_MANUAL_Z,Math.min(1900,pinch.v.h*sc));
    target.x=wx-px*target.w;
    target.y=wy-py*target.h;
    directTargetToView();

  }else if(drag){
    const dx=e.clientX-last.x,dy=e.clientY-last.y;
    target.x-=dx/innerWidth*target.w;
    target.y-=dy/innerHeight*target.h;
    last={x:e.clientX,y:e.clientY};
    directTargetToView();
  }
};

function end(e){
  ptr.delete(e.pointerId);
  if(ptr.size<2)pinch=null;
  if(!ptr.size){
    drag=false;
    last=null;
    finishInteractionSoon(70);
  }
}
svg.onpointerup=end;

  }
