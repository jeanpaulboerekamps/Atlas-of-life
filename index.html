<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Atlas of Life — Interactive Prototype</title>
<style>
:root{--bg:#e4efea;--panel:#fffdf9ee;--text:#17372f;--muted:#627c73}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
#app{position:relative;width:100%;height:100%;background:linear-gradient(145deg,#f3f6ef,#dceae7)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.ocean{fill:#e6efeb}
.grid{fill:none;stroke:#66857a;stroke-width:1;opacity:.1;vector-effect:non-scaling-stroke}
.coast{stroke:#fffdf7;stroke-width:12;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.r1{stroke:#fffdf7;stroke-width:8;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.r2{stroke:#fffdf7;stroke-width:5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.r3{stroke:#fffdf7;stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.r4{stroke:#fffdf7;stroke-width:2;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.taxon{cursor:pointer;transition:filter .15s,opacity .15s}
.taxon:hover{filter:brightness(1.04)}
.title,.major,.mid,.minor,.tiny{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17372f;pointer-events:none;paint-order:stroke;stroke:#fff9;stroke-width:2px;stroke-linejoin:round}
.title{font-weight:850}.major{font-weight:800}.mid{font-weight:720}.minor{font-weight:620}.tiny{font-weight:520;fill:#45675d}
.latin{font-family:Georgia,serif;font-style:italic;fill:#466b60;pointer-events:none;paint-order:stroke;stroke:#fff9;stroke-width:1.5px}
.rank{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:3px;fill:#668078;pointer-events:none}
.obs{fill:#ef9f43;stroke:#fff9e8;stroke-width:2.5;vector-effect:non-scaling-stroke}
.obsHalo{fill:#ef9f43;opacity:.16}
.layer{transition:opacity .18s}.hiddenZoom{opacity:0;pointer-events:none}
.topbar{position:absolute;left:18px;right:18px;top:16px;display:flex;gap:12px;align-items:center;pointer-events:none}
.card{background:var(--panel);border:1px solid #36524724;box-shadow:0 10px 35px #36524720;border-radius:17px;backdrop-filter:blur(12px);pointer-events:auto}
.brand{padding:11px 14px;min-width:230px}.brand b{display:block;font-size:18px}.brand span{font-size:11px;color:var(--muted)}
.search{flex:1;max-width:560px;padding:8px 12px;display:flex;align-items:center;gap:7px}
.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:15px}
.controls{margin-left:auto;padding:8px 10px;display:flex;gap:8px}
button{border:1px solid #36524727;background:#fffdf9;color:#24463c;border-radius:11px;padding:8px 11px;font-size:12px}
button:active{transform:translateY(1px)}
#crumbs{position:absolute;left:18px;top:83px;display:flex;gap:6px;flex-wrap:wrap;max-width:75vw}
.crumb{background:#fffdf9ee;border:1px solid #36524720;border-radius:999px;padding:6px 9px;font-size:11px;color:#31594b;box-shadow:0 4px 12px #36524712;cursor:pointer}
.zoomBadge{position:absolute;right:18px;top:84px;padding:7px 10px;font-size:11px;color:#45675d}
.legend{position:absolute;left:18px;bottom:18px;padding:10px 12px;font-size:11px;line-height:1.55;color:#587169}
.legend b{color:#24463c}
.tip{position:absolute;display:none;pointer-events:none;z-index:10;background:#fffdf9f5;border:1px solid #36524728;border-radius:12px;padding:9px 11px;box-shadow:0 8px 24px #36524725;font-size:12px;max-width:280px}
.tip b{display:block}.tip span{color:var(--muted)}
@media(max-width:850px){.brand{min-width:0}.brand span{display:none}.controls button:nth-child(2){display:none}#crumbs{top:78px;max-width:65vw}.zoomBadge{top:78px}.legend{font-size:10px}}
</style>
</head>

<script>
(() => {
  const svg=document.getElementById('map');
  const tip=document.getElementById('tip');
  const badge=document.getElementById('zoomBadge');
  const crumbs=document.getElementById('crumbs');
  const search=document.getElementById('search');
  const obsLayer=document.getElementById('layer-observations');
  const obsToggle=document.getElementById('obsToggle');

  const world={x:0,y:0,w:2400,h:1500};
  let view={...world}, target={...world};
  let drag=false, last=null, pinch=null, obsVisible=true, focused='Life';

  const taxa=[...document.querySelectorAll('.taxon')];
  const byId=new Map(taxa.map(t=>[t.id,t]));

  function parseBBox(el){
    const [x,y,w,h]=el.dataset.bbox.split(',').map(Number); return {x,y,w,h};
  }
  function zoomFactor(){ return world.w/view.w; }

  function setTarget(r,pad=0.12){
    const px=r.w*pad, py=r.h*pad;
    target={x:r.x-px,y:r.y-py,w:r.w+2*px,h:r.h+2*py};
    fitAspect(target);
  }
  function fitAspect(r){
    const ar=innerWidth/innerHeight, rr=r.w/r.h;
    if(rr>ar){ const nh=r.w/ar, d=nh-r.h; r.y-=d/2; r.h=nh; }
    else { const nw=r.h*ar, d=nw-r.w; r.x-=d/2; r.w=nw; }
  }
  function clamp(r){
    const maxW=3000,maxH=1900;
    r.w=Math.min(maxW,Math.max(55,r.w)); r.h=Math.min(maxH,Math.max(35,r.h));
  }
  function render(){
    const ease=.18;
    view.x+=(target.x-view.x)*ease; view.y+=(target.y-view.y)*ease;
    view.w+=(target.w-view.w)*ease; view.h+=(target.h-view.h)*ease;
    svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);
    const z=zoomFactor();
    badge.textContent=`zoom ${z.toFixed(2)}×`;
    document.querySelectorAll('.layer[data-minzoom]').forEach(layer=>{
      const min=+layer.dataset.minzoom;
      layer.classList.toggle('hiddenZoom', z<min);
    });
    if(!obsVisible) obsLayer.classList.add('hiddenZoom');
    requestAnimationFrame(render);
  }

  function ancestors(id){
    if(id==='Life') return [];
    const arr=[]; let el=byId.get(id);
    while(el){ arr.unshift(el); const p=el.dataset.parent; el=byId.get(p); }
    return arr;
  }
  function renderCrumbs(id){
    crumbs.innerHTML='';
    const home=document.createElement('span'); home.className='crumb'; home.textContent='Leven'; home.onclick=goHome; crumbs.appendChild(home);
    ancestors(id).forEach(el=>{
      const c=document.createElement('span'); c.className='crumb'; c.textContent=el.dataset.name; c.onclick=()=>focusTaxon(el.id); crumbs.appendChild(c);
    });
  }
  function focusTaxon(id){
    const el=byId.get(id); if(!el)return;
    focused=id; setTarget(parseBBox(el),.18); renderCrumbs(id);
  }
  function goHome(){ focused='Life'; target={...world}; fitAspect(target); renderCrumbs('Life'); }

  taxa.forEach(el=>{
    el.addEventListener('pointerdown',e=>{e.stopPropagation(); focusTaxon(el.id)});
    el.addEventListener('pointermove',e=>{
      tip.style.display='block'; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+12)+'px';
      tip.innerHTML=`<b>${el.dataset.name}</b><span>${el.dataset.latin} · ${el.dataset.rank}</span>`;
    });
    el.addEventListener('pointerleave',()=>tip.style.display='none');
  });

  // Wheel zoom for desktop
  svg.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=svg.getBoundingClientRect();
    const px=(e.clientX-rect.left)/rect.width, py=(e.clientY-rect.top)/rect.height;
    const wx=target.x+px*target.w, wy=target.y+py*target.h;
    const f=Math.exp(e.deltaY*.0013);
    target.w*=f; target.h*=f; clamp(target);
    target.x=wx-px*target.w; target.y=wy-py*target.h;
  },{passive:false});

  // Pointer pan + two-finger pinch
  const pointers=new Map();
  svg.addEventListener('pointerdown',e=>{
    svg.setPointerCapture?.(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){drag=true;last={x:e.clientX,y:e.clientY};}
    if(pointers.size===2){
      const p=[...pointers.values()];
      pinch={dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),view:{...target},cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2};
      drag=false;
    }
  });
  svg.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2 && pinch){
      const p=[...pointers.values()];
      const dist=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
      const scale=pinch.dist/dist;
      const rect=svg.getBoundingClientRect();
      const px=(pinch.cx-rect.left)/rect.width, py=(pinch.cy-rect.top)/rect.height;
      const wx=pinch.view.x+px*pinch.view.w, wy=pinch.view.y+py*pinch.view.h;
      target.w=pinch.view.w*scale; target.h=pinch.view.h*scale; clamp(target);
      target.x=wx-px*target.w; target.y=wy-py*target.h;
    } else if(drag && last){
      const dx=e.clientX-last.x, dy=e.clientY-last.y;
      target.x-=dx/innerWidth*target.w; target.y-=dy/innerHeight*target.h;
      last={x:e.clientX,y:e.clientY};
    }
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if(pointers.size<2)pinch=null;
    if(pointers.size===1){const p=[...pointers.values()][0];last={x:p.x,y:p.y};drag=true}
    else if(!pointers.size){drag=false;last=null}
  }
  svg.addEventListener('pointerup',endPointer); svg.addEventListener('pointercancel',endPointer);

  function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
  search.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const q=norm(search.value.trim()); if(!q)return;
    let hit=taxa.find(t=>norm(t.dataset.name)===q||norm(t.dataset.latin)===q);
    if(!hit)hit=taxa.find(t=>norm(t.dataset.name).includes(q)||norm(t.dataset.latin).includes(q));
    if(hit)focusTaxon(hit.id);
  });

  document.getElementById('home').onclick=goHome;
  obsToggle.onclick=()=>{
    obsVisible=!obsVisible;
    obsToggle.textContent=obsVisible?'Waarnemingen aan':'Waarnemingen uit';
    obsLayer.style.display=obsVisible?'':'none';
  };

  goHome(); requestAnimationFrame(render);
})();
</script>
</body></html>
