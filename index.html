<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Atlas of Life — landscape hierarchy v18</title>
<style>
:root{--sea:#1e9fd0;--ink:#17372f;--panel:#fffdf9f5;--muted:#60776e}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--sea);font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}
#app{position:relative;width:100%;height:100%;background:radial-gradient(circle at 50% 40%,#54c4e2 0%,#29a9d4 45%,#1688bd 100%)}
svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.sea{fill:url(#oceanGradient)}
.grid{fill:none;stroke:#d7f4fb;stroke-width:2;opacity:.10;vector-effect:non-scaling-stroke}
.taxonPath{cursor:pointer;stroke:#fffdf2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:opacity .18s,filter .12s;filter:drop-shadow(0 1px 2px #075b7d35)}
.taxonPath:hover{filter:brightness(1.045)}
.continentHaloWide{fill:none;stroke:#9de8f7;stroke-opacity:.30;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.continentHaloNear{fill:none;stroke:#fff5c7;stroke-opacity:.82;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.label{font-weight:760;fill:#18372f;pointer-events:none;paint-order:stroke;stroke:#fffdf8e8;stroke-width:2.4px;stroke-linejoin:round}
.hidden{opacity:0;pointer-events:none}
.top{position:absolute;left:16px;right:16px;top:14px;display:flex;gap:10px;align-items:center;pointer-events:none}
.card{background:var(--panel);border:1px solid #35524723;border-radius:16px;box-shadow:0 9px 30px #3552471d;backdrop-filter:blur(11px);pointer-events:auto}
.brand{padding:10px 13px;min-width:225px}.brand b{display:block;font-size:18px}.brand small{color:var(--muted)}
.search{flex:1;max-width:560px;padding:9px 12px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}
.controls{margin-left:auto;padding:7px;display:flex;gap:7px}.controls button{border:1px solid #35524725;background:#fffdf9;color:#24463c;border-radius:10px;padding:8px 10px}
#crumbs{position:absolute;left:16px;top:76px;display:flex;gap:5px;flex-wrap:wrap;max-width:72vw}.crumb{background:#fffdf9e9;border:1px solid #35524720;border-radius:999px;padding:5px 8px;font-size:10px;cursor:pointer}
.status{position:absolute;left:16px;bottom:16px;padding:9px 11px;font-size:10px;color:#536d64}
.zoom{position:absolute;right:16px;bottom:16px;padding:8px 10px;font-size:10px}
.level{position:absolute;right:16px;top:77px;padding:7px 10px;font-size:10px;color:#4d6b61}
</style></head>
<body><div id="app">
<svg id="map" viewBox="0 0 2400 1500">
<defs>
  <linearGradient id="oceanGradient" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#43bee3"/>
    <stop offset="46%" stop-color="#22a7d4"/>
    <stop offset="100%" stop-color="#1186ba"/>
  </linearGradient>
  <radialGradient id="oceanGlow" cx="50%" cy="42%" r="72%">
    <stop offset="0%" stop-color="#b6eff8" stop-opacity=".22"/>
    <stop offset="52%" stop-color="#55c6e2" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#0478a8" stop-opacity=".10"/>
  </radialGradient>
  <filter id="landTexture" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.020" numOctaves="2" seed="7" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
    <feComponentTransfer in="grey" result="soft">
      <feFuncA type="table" tableValues="0 0 .13"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="soft" mode="soft-light"/>
  </filter>
</defs>
<rect class="sea" width="2400" height="1500"/>
<rect width="2400" height="1500" fill="url(#oceanGlow)"/>
<g class="grid">
  <path d="M-80 260 C440 170 840 335 1270 260 S2040 160 2480 280"/>
  <path d="M-90 520 C520 430 900 610 1430 515 S2070 470 2490 560"/>
  <path d="M-100 850 C470 760 980 920 1450 835 S2010 745 2490 890"/>
  <path d="M-120 1200 C520 1080 980 1260 1510 1175 S2080 1090 2510 1210"/>
</g>
<g id="halos"></g><g id="regions"></g><g id="labels"></g>
</svg>
<div class="top">
  <div class="card brand"><b>Atlas of Life</b><small>levend landschap · iNaturalist-gewogen taxonomie</small></div>
  <div class="card search"><input id="search" placeholder="Zoek taxon…" autocomplete="off"></div>
  <div class="card controls"><button id="home">Wereld</button></div>
</div>
<div id="crumbs"></div>
<div id="status" class="card status">taxonomie laden…</div>
<div id="level" class="card level">wereld</div>
<div id="zoom" class="card zoom">1.00×</div>
</div>
<script>
(async()=>{
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('map');
const hg=document.getElementById('halos'), rg=document.getElementById('regions'), lg=document.getElementById('labels');
const status=document.getElementById('status'), zoomEl=document.getElementById('zoom');
const levelEl=document.getElementById('level'), crumbs=document.getElementById('crumbs');

const payload=await fetch('data/taxa.json',{cache:'no-store'}).then(r=>r.json());
const taxa=payload.taxa;
const byId=new Map(taxa.map(t=>[String(t.id),t]));

let roots=taxa.filter(t=>!t.parentId||!byId.has(String(t.parentId)));
if(roots.length>1){
  const life={id:'__life',parentId:null,canonicalName:'Life',rank:'ROOT',
    mapWeight:roots.reduce((a,t)=>a+Math.max(.0001,+t.mapWeight||+t.weight||1),0),depth:-1};
  taxa.push(life);byId.set(life.id,life);roots.forEach(t=>t.parentId=life.id);roots=[life];
}

const children=new Map();
taxa.forEach(t=>{const p=String(t.parentId);if(!children.has(p))children.set(p,[]);children.get(p).push(t)});

function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967295}
function h2(s,k=0){return hash(String(s)+'|'+k)}
function weight(t){return Math.max(.0001,+t.mapWeight||+t.weight||1)}

const rootPalette={
  Animalia:'#20b98f',
  Plantae:'#4fbe55',
  Fungi:'#8b68cf',
  Bacteria:'#4e82d8'
};
const rankFallback={DOMAIN:'#89abc0',KINGDOM:'#8fb9d4',PHYLUM:'#98c4ad',CLASS:'#acd19e',ORDER:'#cbd993',FAMILY:'#bdd7ad',GENUS:'#d0dfbd',SPECIES:'#e1ead8',ROOT:'#eef3eb'};

function tint(hex,f){
  let n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  return`rgb(${Math.round(r+(255-r)*f)},${Math.round(g+(255-g)*f)},${Math.round(b+(255-b)*f)})`
}
function rootAncestor(t){
  let cur=t,last=t;
  while(cur&&cur.parentId&&byId.has(String(cur.parentId))){
    last=cur;
    const p=byId.get(String(cur.parentId));
    if(!p||p.id==='__life')break;
    cur=p;
  }
  return cur||last;
}
function colorFor(t){
  const root=rootAncestor(t);
  const rootName=root?.canonicalName;
  let base=rootPalette[rootName]||rankFallback[(t.rank||'').toUpperCase()]||'#a9cdb9';

  const d=Math.max(0,t.depth||0);
  const r=(t.rank||'').toUpperCase();

  /* The illustrated sketch is more colorful within Animalia and Plantae:
     some lineages become yellow-green, others deep teal. */
  let f=.025+.035*d+.10*h2(t.id,50);

  if(rootName==='Animalia'){
    const hue=h2(t.id,8100);
    if(hue>.68) base='#9fce4f';
    else if(hue<.24) base='#27b997';
    else if(hue>.50) base='#7ecb70';
  }else if(rootName==='Plantae'){
    const hue=h2(t.id,8200);
    if(hue>.72) base='#b4d95d';
    else if(hue<.28) base='#36a957';
    else if(hue>.50) base='#80ce68';
  }else if(rootName==='Fungi'){
    const hue=h2(t.id,8300);
    if(hue>.58) base='#aa91df';
    else if(hue<.28) base='#7658b7';
  }else if(rootName==='Bacteria'){
    const hue=h2(t.id,8400);
    if(hue>.62) base='#7aa4e5';
    else if(hue<.25) base='#3f74c9';
  }
  return tint(base,Math.min(.30,f));
}

function polygonArea(poly){let a=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];a+=p.x*q.y-q.x*p.y}return a/2}
function absArea(poly){return Math.abs(polygonArea(poly))}
function polygonCentroid(poly){let a=polygonArea(poly),cx=0,cy=0;if(Math.abs(a)<1e-8){let x=0,y=0;for(const p of poly){x+=p.x;y+=p.y}return{x:x/poly.length,y:y/poly.length}}for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],f=p.x*q.y-q.x*p.y;cx+=(p.x+q.x)*f;cy+=(p.y+q.y)*f}return{x:cx/(6*a),y:cy/(6*a)}}
function polyBBox(poly){let xs=poly.map(p=>p.x),ys=poly.map(p=>p.y);let x=Math.min(...xs),X=Math.max(...xs),y=Math.min(...ys),Y=Math.max(...ys);return{x,y,w:X-x,h:Y-y}}
function cleanPoly(poly){const out=[];for(const p of poly){const q=out[out.length-1];if(!q||Math.hypot(p.x-q.x,p.y-q.y)>.001)out.push({x:p.x,y:p.y})}if(out.length>2&&Math.hypot(out[0].x-out[out.length-1].x,out[0].y-out[out.length-1].y)<.001)out.pop();return out}


function pointInPoly(p,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i],b=poly[j];
    const hit=((a.y>p.y)!=(b.y>p.y)) &&
      (p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y+1e-12)+a.x);
    if(hit)inside=!inside;
  }
  return inside;
}


function organicBlob(cx,cy,rx,ry,id,detail=44){
  const pts=[];
  const phase=2*Math.PI*h2(id,7001);

  for(let i=0;i<detail;i++){
    const a=2*Math.PI*i/detail;

    /* Stronger multi-scale irregularity: broad lobes plus smaller bays.
       q never exceeds 1, so the polygon remains inside its collision ellipse. */
    let q=.82
      +.105*Math.sin(2*a+phase*.55)
      +.075*Math.sin(3*a+phase)
      +.052*Math.sin(5*a-phase*.72)
      +.032*Math.sin(8*a+phase*1.6)
      +.026*Math.sin(13*a-phase*.3)
      +.040*(h2(id,7100+i)-.5);

    const bay=h2(id,7600+i);
    if(bay>.82)q-=.075+.075*h2(id,7700+i);
    if(bay<.08)q+=.035*h2(id,7800+i);

    q=Math.max(.56,Math.min(.985,q));

    const yWarp=.90
      +.075*Math.sin(2*a+phase*.30)
      +.035*Math.sin(4*a-phase*.2);

    pts.push({
      x:cx+Math.cos(a)*rx*q,
      y:cy+Math.sin(a)*ry*q*yWarp
    });
  }
  return cleanPoly(pts);
}

function pointInPoly(p,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i],b=poly[j];
    const hit=((a.y>p.y)!=(b.y>p.y)) &&
      (p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y+1e-12)+a.x);
    if(hit)inside=!inside;
  }
  return inside;
}
function ellipseFits(poly,x,y,rx,ry){
  if(!pointInPoly({x,y},poly))return false;
  const n=20;
  for(let i=0;i<n;i++){
    const a=2*Math.PI*i/n;
    if(!pointInPoly({x:x+Math.cos(a)*rx,y:y+Math.sin(a)*ry},poly))return false;
  }
  return true;
}
function nudgeInside(poly,item,center){
  let tries=0;
  while(tries++<38&&!ellipseFits(poly,item.x,item.y,item.rx,item.ry)){
    item.x=item.x*.91+center.x*.09;
    item.y=item.y*.91+center.y*.09;
    if(tries%6===0){
      item.rx*=.95;item.ry*=.95;item.bound=Math.max(item.rx,item.ry);
    }
  }
}

function resolveCollisions(items,parentPoly,parentCenter){
  for(let pass=0;pass<170;pass++){
    for(let i=0;i<items.length;i++){
      const a=items[i];
      let fx=(parentCenter.x-a.x)*.0012,fy=(parentCenter.y-a.y)*.0012;
      for(let j=0;j<items.length;j++)if(i!==j){
        const b=items[j],dx=a.x-b.x,dy=a.y-b.y;
        const d=Math.hypot(dx,dy)||.001;
        const min=(a.bound+b.bound)*.975;
        if(d<min){
          const push=(min-d)*.19;
          fx+=dx/d*push;fy+=dy/d*push;
        }
      }
      a.x+=fx;a.y+=fy;
      if(pass%4===0)nudgeInside(parentPoly,a,parentCenter);
    }
  }
}

function addSatelliteIslands(parentPoly,parentId,depth){
  /* purely decorative tiny islands; no taxon ownership, pointer-events disabled */
  const b=polyBBox(parentPoly),c=polygonCentroid(parentPoly);
  const count=depth<=1?7:depth===2?4:0;
  const sats=[];
  for(let i=0;i<count;i++){
    const a=2*Math.PI*h2(parentId,9000+i);
    const rr=.42+.42*h2(parentId,9050+i);
    const x=c.x+Math.cos(a)*b.w*.50*rr;
    const y=c.y+Math.sin(a)*b.h*.50*rr;
    const r=Math.max(4,Math.min(b.w,b.h)*(.018+.018*h2(parentId,9100+i)));
    if(pointInPoly({x,y},parentPoly))continue;
    sats.push({x,y,r,id:parentId+'sat'+i});
  }
  return sats;
}

function packChildren(parentPoly,items,depth,parentId){
  if(!items.length)return;

  const area=absArea(parentPoly),box=polyBBox(parentPoly),center=polygonCentroid(parentPoly);
  const total=items.reduce((s,t)=>s+weight(t),0);

  /* More dense than v15, but still leaves open water channels. */
  const fillRatio=depth<=1?.94:depth===2?.93:depth===3?.92:.91;
  const usable=Math.max(1,area*fillRatio);

  const packed=items.map((t,i)=>{
    const share=weight(t)/total;
    const equivalent=Math.sqrt(usable*share/Math.PI);

    /* varied aspect ratio like the painted reference */
    const asp=.72+.58*h2(t.id,7201);
    const rx=equivalent*Math.sqrt(asp);
    const ry=equivalent/Math.sqrt(asp);

    /* Fibonacci-ish placement, but with stronger randomness */
    const ang=i*2.3999632297+2*Math.PI*h2(parentId,7300+i);
    const radial=.35*Math.min(box.w,box.h)*Math.sqrt((i+.45)/(items.length+.25));
    const wobble=.12*Math.min(box.w,box.h);

    return{
      t,rx,ry,bound:Math.max(rx,ry),
      x:center.x+Math.cos(ang)*radial+(h2(t.id,7401)-.5)*wobble,
      y:center.y+Math.sin(ang)*radial+(h2(t.id,7402)-.5)*wobble
    };
  });

  for(let round=0;round<9;round++){
    for(const p of packed)nudgeInside(parentPoly,p,center);
    resolveCollisions(packed,parentPoly,center);

    let bad=false;
    for(let i=0;i<packed.length&&!bad;i++){
      if(!ellipseFits(parentPoly,packed[i].x,packed[i].y,packed[i].rx,packed[i].ry)){bad=true;break}
      for(let j=i+1;j<packed.length;j++){
        if(Math.hypot(packed[i].x-packed[j].x,packed[i].y-packed[j].y)<
           (packed[i].bound+packed[j].bound)*.955){bad=true;break}
      }
    }
    if(!bad)break;

    for(const p of packed){
      p.rx*=.955;p.ry*=.955;p.bound=Math.max(p.rx,p.ry);
      p.x=p.x*.95+center.x*.05;p.y=p.y*.95+center.y*.05;
    }
  }

  for(const p of packed){
    const t=p.t;
    t.depth=depth;
    t.poly=organicBlob(p.x,p.y,p.rx,p.ry,t.id,depth<2?44:34);
    t.cellPoly=t.poly;
    const cs=children.get(String(t.id))||[];
    if(cs.length)packChildren(t.poly,cs,depth+1,String(t.id));
  }
}
function rootContinent(box,t,targetArea){
  const cx=box.x+box.w/2,cy=box.y+box.h/2;
  const aspect=box.w/box.h;

  let rx=Math.sqrt(targetArea*aspect/Math.PI);
  let ry=Math.sqrt(targetArea/(aspect*Math.PI));

  /* Keep ocean between continents like the sketch. */
  const maxRx=box.w*.455,maxRy=box.h*.455;
  const s=Math.min(1,maxRx/rx,maxRy/ry);
  rx*=s;ry*=s;

  /* Shift slightly to break a rigid grid composition. */
  const jx=(h2(t.id,9500)-.5)*box.w*.06;
  const jy=(h2(t.id,9501)-.5)*box.h*.06;

  return organicBlob(cx+jx,cy+jy,rx,ry,t.id,54);
}

function layoutRootContinents(){
  const top=children.get(String(roots[0].id))||[];
  if(!top.length)return;

  /* Approximate composition of the illustrated sketch, but the continents
     are now packed against one another instead of living in isolated boxes. */
  const preferred={
    Plantae:{x:520,y:440},
    Animalia:{x:1540,y:500},
    Fungi:{x:470,y:1120},
    Bacteria:{x:1770,y:1160}
  };

  const total=top.reduce((s,t)=>s+weight(t),0);
  const worldArea=2400*1500;

  /* Much more land than v16: only ~22% of the canvas is deliberate ocean. */
  const landBudget=worldArea*.78;

  const items=top.map((t,i)=>{
    const share=weight(t)/total;
    const area=landBudget*share;

    /* preserve broad visual character while letting weights control size */
    const aspect=t.canonicalName==='Animalia'?1.55:
                 t.canonicalName==='Plantae'?1.18:
                 t.canonicalName==='Fungi'?1.25:1.42;

    let rx=Math.sqrt(area*aspect/Math.PI);
    let ry=Math.sqrt(area/(aspect*Math.PI));

    const p=preferred[t.canonicalName]||{
      x:500+450*i,
      y:i<2?430:1110
    };

    return{
      t,x:p.x,y:p.y,rx,ry,bound:Math.max(rx,ry)
    };
  });

  /* Scale all roots together until their collision ellipses can fit
     comfortably in the viewport. */
  for(let scaleRound=0;scaleRound<9;scaleRound++){
    let bad=false;

    for(let pass=0;pass<150;pass++){
      for(let i=0;i<items.length;i++){
        const a=items[i];
        const pref=preferred[a.t.canonicalName]||{x:a.x,y:a.y};

        let fx=(pref.x-a.x)*.018;
        let fy=(pref.y-a.y)*.018;

        for(let j=0;j<items.length;j++)if(i!==j){
          const b=items[j];
          const dx=a.x-b.x,dy=a.y-b.y;
          const d=Math.hypot(dx,dy)||.001;
          const min=(a.bound+b.bound)*.82;  // close, slightly interlocking appearance
          if(d<min){
            const push=(min-d)*.15;
            fx+=dx/d*push;fy+=dy/d*push;
          }
        }

        /* soft canvas boundaries */
        const pad=24;
        if(a.x-a.rx<pad)fx+=(pad-(a.x-a.rx))*.10;
        if(a.x+a.rx>2400-pad)fx-=((a.x+a.rx)-(2400-pad))*.10;
        if(a.y-a.ry<pad)fy+=(pad-(a.y-a.ry))*.10;
        if(a.y+a.ry>1500-pad)fy-=((a.y+a.ry)-(1500-pad))*.10;

        a.x+=fx;a.y+=fy;
      }
    }

    for(let i=0;i<items.length;i++){
      const a=items[i];
      if(a.x-a.rx<10||a.x+a.rx>2390||a.y-a.ry<10||a.y+a.ry>1490){bad=true;break}
      for(let j=i+1;j<items.length;j++){
        const b=items[j];
        if(Math.hypot(a.x-b.x,a.y-b.y)<(a.bound+b.bound)*.79){bad=true;break}
      }
      if(bad)break;
    }

    if(!bad)break;
    for(const a of items){
      a.rx*=.94;a.ry*=.94;a.bound=Math.max(a.rx,a.ry);
    }
  }

  for(const a of items){
    const t=a.t;
    t.depth=0;
    t.poly=organicBlob(a.x,a.y,a.rx,a.ry,t.id,58);
    t.cellPoly=t.poly;

    const cs=children.get(String(t.id))||[];
    if(cs.length)packChildren(t.poly,cs,1,String(t.id));
  }
}
layoutRootContinents();

/* v18: parents no longer dictate the landscape.  Their coastlines are rebuilt
   bottom-up from the actual child regions.  This makes Animalia, Aves, etc.
   read as the envelope of their descendants rather than as a large empty plate. */
function convexHull(points){
  if(points.length<4)return points.slice();
  const pts=points.slice().sort((a,b)=>a.x===b.x?a.y-b.y:a.x-b.x);
  const cross=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
  const lo=[];
  for(const p of pts){
    while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();
    lo.push(p);
  }
  const hi=[];
  for(let i=pts.length-1;i>=0;i--){
    const p=pts[i];
    while(hi.length>=2&&cross(hi[hi.length-2],hi[hi.length-1],p)<=0)hi.pop();
    hi.push(p);
  }
  lo.pop();hi.pop();
  return lo.concat(hi);
}
function descendantCoast(t){
  const cs=children.get(String(t.id))||[];
  if(!cs.length)return t.poly;

  for(const c of cs)descendantCoast(c);

  const cloud=[];
  for(const c of cs){
    if(!c.poly)continue;
    const step=Math.max(1,Math.floor(c.poly.length/14));
    for(let i=0;i<c.poly.length;i+=step)cloud.push(c.poly[i]);
  }
  if(cloud.length<3)return t.poly;

  let hull=convexHull(cloud);
  const ctr=polygonCentroid(hull);

  /* Small breathing rim around the descendants. */
  hull=hull.map((p,i)=>{
    const dx=p.x-ctr.x,dy=p.y-ctr.y;
    const q=1.035+.018*Math.sin(i*2.17+6.28*h2(t.id,12000));
    return{x:ctr.x+dx*q,y:ctr.y+dy*q};
  });

  /* Add intermediate points with deterministic coastal bays/capes. */
  const coast=[];
  for(let i=0;i<hull.length;i++){
    const a=hull[i],b=hull[(i+1)%hull.length];
    coast.push(a);
    const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const dx=mx-ctr.x,dy=my-ctr.y;
    const q=.965+.045*h2(t.id,12100+i);
    coast.push({x:ctr.x+dx*q,y:ctr.y+dy*q});
  }
  t.poly=cleanPoly(coast);
  t.cellPoly=t.poly;
  return t.poly;
}
for(const t of (children.get(String(roots[0].id))||[]))descendantCoast(t);

function pathFromPoly(poly){
  if(!poly||poly.length<3)return'';
  const mids=poly.map((p,i)=>{const q=poly[(i+1)%poly.length];return{x:(p.x+q.x)/2,y:(p.y+q.y)/2}});
  let d=`M${mids[mids.length-1].x},${mids[mids.length-1].y}`;
  for(let i=0;i<poly.length;i++)d+=` Q${poly[i].x},${poly[i].y} ${mids[i].x},${mids[i].y}`;
  return d+'Z'
}
function minZoom(t){
  const d=Math.max(0,t.depth||0);
  const rank=(t.rank||'').toUpperCase();
  const rankZ={
    DOMAIN:.72,KINGDOM:.72,
    PHYLUM:.78,
    CLASS:1.18,
    ORDER:1.85,
    FAMILY:3.1,
    GENUS:5.0,
    SPECIES:7.6
  };
  return Math.max(rankZ[rank]||.85,.68+d*.34);
};return Math.max(rankZ[rank]||1.2,1+d*.56)}

const elems=[];
[...taxa].sort((a,b)=>(a.depth||0)-(b.depth||0)).forEach(t=>{
  if(t.id==='__life'||!t.poly||t.poly.length<3)return;
  t.box=polyBBox(t.poly);t.center=polygonCentroid(t.poly);t.area=absArea(t.poly);
  if((t.depth||0)===0){
    const haloWide=document.createElementNS(NS,'path');
    haloWide.setAttribute('d',pathFromPoly(t.poly));haloWide.setAttribute('class','continentHaloWide');haloWide.setAttribute('stroke-width','28');hg.appendChild(haloWide);
    const haloNear=document.createElementNS(NS,'path');
    haloNear.setAttribute('d',pathFromPoly(t.poly));haloNear.setAttribute('class','continentHaloNear');haloNear.setAttribute('stroke-width','9');hg.appendChild(haloNear);
  }
  const p=document.createElementNS(NS,'path');p.setAttribute('d',pathFromPoly(t.poly));p.setAttribute('fill',colorFor(t));
  const dep=Math.max(0,t.depth||0);
  p.setAttribute('fill-opacity',dep===0?'.76':dep===1?'.97':String(.90+.08*h2(t.id,11100)));
  p.setAttribute('class','taxonPath');p.setAttribute('filter','url(#landTexture)');
  p.setAttribute('stroke-width',dep===0?7:Math.max(.8,4.8-dep*.48));p.dataset.minz=minZoom(t);p.dataset.id=t.id;p.onclick=e=>{e.stopPropagation();focus(t)};rg.appendChild(p);
  const text=document.createElementNS(NS,'text');text.setAttribute('x',t.center.x);text.setAttribute('y',t.center.y);text.setAttribute('text-anchor','middle');text.setAttribute('class','label');text.textContent=t.vernacularName||t.canonicalName;text.dataset.minz=((t.depth||0)<=1?minZoom(t)*.94:minZoom(t)*1.04);text.dataset.id=t.id;lg.appendChild(text);
  elems.push({t,p,text})
});

const world={x:0,y:0,w:2400,h:1500};
let view={...world},target={...world},ptr=new Map(),drag=false,last=null,pinch=null,lastSemantic=-1;
function fit(r){let ar=innerWidth/innerHeight,rr=r.w/r.h;if(rr>ar){let nh=r.w/ar,d=nh-r.h;r.y-=d/2;r.h=nh}else{let nw=r.h*ar,d=nw-r.w;r.x-=d/2;r.w=nw}}
function bbox(t){return t.box||polyBBox(t.poly)}
function focus(t){let r={...bbox(t)},pad=.2;r={x:r.x-r.w*pad,y:r.y-r.h*pad,w:r.w*(1+2*pad),h:r.h*(1+2*pad)};fit(r);target=r;renderCrumbs(t);if((t.rank||'').toUpperCase()==='ORDER'&&t.inatObservationCount!=null){levelEl.textContent=`orde · ${Number(t.inatObservationCount).toLocaleString('nl-NL')} iNat-waarnemingen · gewicht ${Number(t.inatAreaWeight||1).toFixed(2)}`}else levelEl.textContent=(t.rank||'taxon').toLowerCase()}
function home(){target={...world};fit(target);crumbs.innerHTML='';levelEl.textContent='wereld'}
document.getElementById('home').onclick=home;
function renderCrumbs(t){let arr=[];while(t&&t.id!=='__life'){arr.unshift(t);t=byId.get(String(t.parentId))}crumbs.innerHTML='';for(const x of arr){let s=document.createElement('span');s.className='crumb';s.textContent=x.canonicalName;s.onclick=()=>focus(x);crumbs.appendChild(s)}}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
document.getElementById('search').onkeydown=e=>{if(e.key!=='Enter')return;let q=norm(e.target.value),hit=taxa.find(t=>norm(t.canonicalName)===q)||taxa.find(t=>norm(t.vernacularName)===q)||taxa.find(t=>norm(t.canonicalName).includes(q));if(hit)focus(hit)}

function semantic(z){
  if(Math.abs(z-lastSemantic)<.08)return;lastSemantic=z;let deepest=0;
  for(const o of elems){
    const visible=z>=+o.p.dataset.minz;o.p.classList.toggle('hidden',!visible);if(visible)deepest=Math.max(deepest,o.t.depth||0);
    const screenW=(o.t.box?.w||0)*z,screenH=(o.t.box?.h||0)*z,labelVisible=visible&&z>=+o.text.dataset.minz&&screenW>((o.t.depth||0)<=1?46:62)&&screenH>((o.t.depth||0)<=1?20:26);
    o.text.classList.toggle('hidden',!labelVisible);if(labelVisible){let fs=Math.max(8,Math.min(22,8.5+Math.sqrt(Math.max(20,Math.min(screenW,screenH)*2))/4.4));if((o.t.depth||0)===0)fs=Math.max(fs,29);else if((o.t.depth||0)===1)fs=Math.max(fs,19);o.text.setAttribute('font-size',fs/z)}
  }
  if(!crumbs.children.length){const names=['rijk/domein','stam','klasse','orde','familie','genus','soort'];levelEl.textContent=names[Math.min(names.length-1,Math.max(0,deepest))]||'wereld'}
}
svg.addEventListener('wheel',e=>{e.preventDefault();let r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height,wx=target.x+px*target.w,wy=target.y+py*target.h,f=Math.exp(e.deltaY*.0012);target.w=Math.max(24,Math.min(3000,target.w*f));target.h=Math.max(15,Math.min(1900,target.h*f));target.x=wx-px*target.w;target.y=wy-py*target.h},{passive:false});
svg.onpointerdown=e=>{svg.setPointerCapture?.(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1){drag=true;last={x:e.clientX,y:e.clientY}}if(ptr.size===2){let p=[...ptr.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),v:{...target},cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2};drag=false}};
svg.onpointermove=e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===2&&pinch){let p=[...ptr.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),sc=pinch.d/d,r=svg.getBoundingClientRect(),px=(pinch.cx-r.left)/r.width,py=(pinch.cy-r.top)/r.height,wx=pinch.v.x+px*pinch.v.w,wy=pinch.v.y+py*pinch.v.h;target.w=Math.max(24,Math.min(3000,pinch.v.w*sc));target.h=Math.max(15,Math.min(1900,pinch.v.h*sc));target.x=wx-px*target.w;target.y=wy-py*target.h}else if(drag){let dx=e.clientX-last.x,dy=e.clientY-last.y;target.x-=dx/innerWidth*target.w;target.y-=dy/innerHeight*target.h;last={x:e.clientX,y:e.clientY}}};
function end(e){ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(!ptr.size){drag=false;last=null}}svg.onpointerup=end;svg.onpointercancel=end;
function anim(){let k=.16;view.x+=(target.x-view.x)*k;view.y+=(target.y-view.y)*k;view.w+=(target.w-view.w)*k;view.h+=(target.h-view.h)*k;svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);let z=2400/view.w;zoomEl.textContent=z.toFixed(2)+'×';semantic(z);requestAnimationFrame(anim)}
status.textContent=`${payload.meta.taxa||taxa.length} taxa · landschap uit afstammelingen · meerdere lagen tegelijk · orde-oppervlakte: iNaturalist · 10× = 2× ruimte`;
home();requestAnimationFrame(anim);
