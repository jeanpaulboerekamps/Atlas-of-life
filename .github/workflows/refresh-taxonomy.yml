name: Refresh taxonomy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DETAIL_AUDIT_WORKERS: "16"
      DETAIL_ORDER_WORKERS: "4"
      DETAIL_FAMILY_WORKERS: "6"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate bounded COL XR taxonomy
        run: python -u generator/generate.py

      - name: Audit FAMILY GENUS SPECIES counts
        run: python -u generator/generate-details.py --audit

      - name: Generate FAMILY GENUS SPECIES detail in parallel
        run: python -u generator/generate-details.py --generate

      - name: Commit refreshed taxonomy
        run: |
          if git diff --quiet data; then
            echo "No taxonomy changes."
            exit 0
          fi

          git config user.name "atlas-of-life-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/taxa.json
          git add data/detail_audit.json
          git add data/detail_manifest.json
          git add data/orders
          git add data/families
          git add data/search

          if [ -f data/detail_failures.json ]; then
            git add data/detail_failures.json
          fi

          git commit -m "Refresh taxonomy and audited lower-rank detail"
          git push
