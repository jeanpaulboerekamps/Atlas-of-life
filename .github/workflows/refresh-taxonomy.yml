YAML

name: Refresh taxonomy

on:

  workflow_dispatch:

  schedule:

    - cron: "17 4 1 * *"

permissions:

  contents: write

jobs:

  refresh:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Generate bounded COL XR taxonomy

        run: python generator/generate.py

      - name: Commit refreshed taxonomy

        run: |

          if git diff --quiet data/taxa.json; then

            echo "No taxonomy changes."

            exit 0

          fi

          git config user.name "atlas-of-life-bot"

          git config user.email "actions@users.noreply.github.com"

          git add data/taxa.json

          git commit -m "Refresh Catalogue of Life taxonomy"

          git push
