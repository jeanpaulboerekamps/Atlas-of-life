name: Build species coordinates

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-species-coordinates
  cancel-in-progress: false

jobs:
  build-points:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      POINT_EXPORT_WORKERS: "4"
      POINT_EXPORT_BATCH: "6"
      ATLAS_EXPORT_URL: "http://127.0.0.1:8765/"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify existing taxonomy data
        run: |
          test -s data/taxa.json
          test -d data/orders
          test -d data/families

      - name: Install coordinate exporter
        run: |
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Export fixed species coordinates only
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/atlas-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8765/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8765/ > /dev/null
          node generator/generate-points.mjs

      - name: Commit fixed species coordinates
        run: |
          if [ -z "$(git status --porcelain -- data/points)" ]; then
            echo "No coordinate changes."
            exit 0
          fi

          git config user.name "atlas-of-life-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/points
          git commit -m "Build fixed species coordinates"
          git push
