name: Refresh taxonomy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate ORDER-FIRST taxonomy
        run: python -u generator/generate.py

      - name: Generate FAMILY / GENUS / SPECIES detail
        run: python -u generator/generate-details.py

      - name: Commit refreshed taxonomy
        run: |
          if git diff --quiet data; then
            echo "No taxonomy changes."
            exit 0
          fi

          git config user.name "atlas-of-life-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/taxa.json
          git add data/detail_manifest.json
          git add data/orders
          git add data/families
          git add data/search

          git commit -m "Refresh taxonomy and lower-rank detail"
          git push
